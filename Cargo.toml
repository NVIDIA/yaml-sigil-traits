[package]
name = "yaml-sigil-traits"
description = "Shared traits and data types for signing, transcription, and verification"
version = "0.4.0-rc.1"
authors = ["yaml-sigil-dev <yaml-sigil-dev+crates-io@nvidia.com>"]
edition = "2024"
# Keep this package library-only. An executable target requires an explicit
# manifest change and is also rejected by the release workflow.
autobins = false
# TODO: We seek to reduce this, we just need to do the testing.
rust-version = "1.95.0"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/yaml-sigil-traits"
documentation = "https://docs.rs/yaml-sigil-traits"
readme = "README.md"
keywords = ["yaml", "agent", "digital-signature", "cryptography", "traits"]
categories = ["authentication", "cryptography"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/CHANGELOG.md",
    "/tests/**",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/THIRD_PARTY_NOTICES.md",
]

[package.metadata.cargo-semver-checks.lints]
function_must_use_added = "warn"
inherent_method_must_use_added = "warn"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
thiserror = "2.0"
