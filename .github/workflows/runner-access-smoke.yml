name: NVIDIA CPU runner smoke

on:
  push:
    branches:
      - "pull-request/[0-9]+"

permissions: {}

jobs:
  runner_access:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: linux-amd64-cpu4
            minimum_cpu_count: 4
          - runner: linux-amd64-cpu8
            minimum_cpu_count: 8
    steps:
      - name: Verify the selected runner class
        env:
          MINIMUM_CPU_COUNT: ${{ matrix.minimum_cpu_count }}
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "X64"
          actual_cpu_count="$(getconf _NPROCESSORS_ONLN)"
          test "${actual_cpu_count}" -ge "${MINIMUM_CPU_COUNT}"
          printf 'Verified Linux X64 runner with %s CPUs.\n' "${actual_cpu_count}"
