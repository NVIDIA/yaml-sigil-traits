name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow_lint:
    name: GitHub Actions
    runs-on: linux-amd64-cpu4
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: devops-actions/actionlint@9fb9c192862f19e684586ca84b500461bcd8a541 # v0.1.12 (actionlint v1.7.12)

      # This section would benefit by a change to the action allowlist
      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          check_together: true
          scandir: .github/scripts
          version: v0.11.0

      - name: Compile and test automation controllers
        run: |
          python3 -m py_compile \
            .github/scripts/protected_pr_ci.py \
            .github/scripts/test_protected_pr_ci.py
          python3 -m unittest discover \
            -s .github/scripts -p 'test_*.py'

  platform_verifier:
    name: Protected policy verifier tests (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exercise the checkout verifier on each supported host, including a
      # real Windows directory junction rather than a mocked reparse point.
      - name: Compile and test protected checkout verifier
        shell: bash
        run: |
          python3 -m py_compile \
            .github/scripts/protected_checkout.py \
            .github/scripts/protected_pr_ci.py \
            .github/scripts/test_protected_pr_ci.py
          python3 -m unittest discover \
            -s .github/scripts -p 'test_protected_pr_ci.py'

  static_checks:
    name: Documentation
    runs-on: linux-amd64-cpu4
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned specification
        env:
          GIT_ASKPASS: /bin/false
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: >-
          git -c credential.helper= submodule update --init --depth 1
          --checkout -- source-spec

      - name: Lint Markdown
        # Refresh this immutable pin frequently to keep pace with rumdl releases.
        uses: rvben/rumdl@95a982d941d00cf41a0dcef4d0788bd15a29be1b # v0.2.54
        with:
          version: "0.2.54"

  rust:
    name: Rust (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: linux-amd64-cpu8
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove unused preinstalled Homebrew source
        if: ${{ runner.os == 'macOS' }}
        run: .github/scripts/remove-preinstalled-aws-tap.sh

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          components: clippy, rustfmt

      # This section would benefit by a change to the action allowlist
      - name: Install Rust validation tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          checksum: true
          fallback: none
          tool: cargo-audit,cargo-deny@0.20.2,cargo-machete@0.9.2

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            xtask -> target

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check xtask formatting
        run: cargo fmt --manifest-path xtask/Cargo.toml --all --check

      - name: Check release version
        run: cargo xtask release-version check

      # Compares yaml-sigil-traits' Cargo source list with its committed
      # inventory. This does not assemble or publish a crate archive.
      - name: Check package contents
        run: cargo xtask package-content

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Lint xtask
        run: cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Test xtask
        run: cargo test --locked --manifest-path xtask/Cargo.toml

      - name: Check unused Rust dependencies
        run: cargo-machete --with-metadata

      - name: Check Rust dependency policy
        run: cargo deny check bans licenses sources -D warnings

      - name: Check xtask dependency policy
        run: >-
          cargo deny --manifest-path xtask/Cargo.toml --locked
          check bans licenses sources -D warnings

      # Audit after the Cargo checks have resolved this platform's dependency
      # graph and generated the intentionally untracked root Cargo.lock.
      - name: Audit Rust dependencies
        run: cargo audit

      # The developer-only xtask has its own committed dependency lockfile.
      - name: Audit xtask dependencies
        run: cargo audit --file xtask/Cargo.lock

  required_ci:
    name: Required CI
    if: ${{ always() }}
    needs:
      - workflow_lint
      - platform_verifier
      - static_checks
      - rust
    runs-on: linux-amd64-cpu4
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful CI jobs
        env:
          GITHUB_ACTIONS_RESULT: ${{ needs.workflow_lint.result }}
          DOCUMENTATION_RESULT: ${{ needs.static_checks.result }}
          PLATFORM_VERIFIER_RESULT: ${{ needs.platform_verifier.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          require_success() {
            local job="$1"
            local result="$2"
            # Aggregate every required job, including the whole OS matrix.
            if [[ "${result}" != "success" ]]; then
              printf '%s finished with result %s; success is required.\n' \
                "${job}" "${result}"
              exit 1
            fi
          }

          require_success "GitHub Actions" "${GITHUB_ACTIONS_RESULT}"
          require_success "Protected checkout verifier matrix" "${PLATFORM_VERIFIER_RESULT}"
          require_success "Documentation" "${DOCUMENTATION_RESULT}"
          require_success "Rust matrix" "${RUST_RESULT}"
