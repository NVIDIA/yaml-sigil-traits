name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit_policy:
    name: Commit policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Accept trusted invocation
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: echo "Commit policy is evaluated on pull requests, not trusted direct invocations."

      - name: Check out pull request history
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check pull request commits
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: .github/scripts/check-pull-request-commits.sh

  workflow_lint:
    name: GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: devops-actions/actionlint@9fb9c192862f19e684586ca84b500461bcd8a541 # v0.1.12 (actionlint v1.7.12)

      # This section would benefit by a change to the action allowlist
      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          check_together: true
          scandir: .github/scripts
          version: v0.11.0

  static_checks:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out pinned specification
        env:
          GIT_ASKPASS: /bin/false
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: >-
          git -c credential.helper= submodule update --init --depth 1
          --checkout -- source-spec

      - name: Lint Markdown
        # Refresh this immutable pin frequently to keep pace with rumdl releases.
        uses: rvben/rumdl@95a982d941d00cf41a0dcef4d0788bd15a29be1b # v0.2.54
        with:
          version: "0.2.54"

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          components: clippy, rustfmt

      # This section would benefit by a change to the action allowlist
      - name: Install Rust validation tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          checksum: true
          fallback: none
          tool: cargo-audit,cargo-machete@0.9.2

      - name: Cache Rust build inputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ github.event_name == 'push' }}
          workspaces: |
            . -> target
            xtask -> target

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check xtask formatting
        run: cargo fmt --manifest-path xtask/Cargo.toml --all --check

      - name: Check release version
        run: cargo xtask release-version check

      # Compares yaml-sigil-traits' Cargo source list with its committed
      # inventory. This does not assemble or publish a crate archive.
      - name: Check package contents
        run: cargo xtask package-content

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Lint xtask
        run: cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Test xtask
        run: cargo test --locked --manifest-path xtask/Cargo.toml

      - name: Check unused Rust dependencies
        run: cargo-machete --with-metadata

      # Audit after the Cargo checks have resolved this platform's dependency
      # graph and generated the intentionally untracked root Cargo.lock.
      - name: Audit Rust dependencies
        run: cargo audit

  required_ci:
    name: Required CI
    if: ${{ always() }}
    needs:
      - commit_policy
      - workflow_lint
      - static_checks
      - rust
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful CI jobs
        env:
          COMMIT_POLICY_RESULT: ${{ needs.commit_policy.result }}
          GITHUB_ACTIONS_RESULT: ${{ needs.workflow_lint.result }}
          DOCUMENTATION_RESULT: ${{ needs.static_checks.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          require_success() {
            local job="$1"
            local result="$2"
            # Aggregate every required job, including the whole OS matrix.
            if [[ "${result}" != "success" ]]; then
              printf '%s finished with result %s; success is required.\n' \
                "${job}" "${result}"
              exit 1
            fi
          }

          require_success "Commit policy" "${COMMIT_POLICY_RESULT}"
          require_success "GitHub Actions" "${GITHUB_ACTIONS_RESULT}"
          require_success "Documentation" "${DOCUMENTATION_RESULT}"
          require_success "Rust matrix" "${RUST_RESULT}"
