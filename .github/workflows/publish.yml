name: Publish

# This workflow publishes source crates and creates only annotated tags and
# immutable, zero-asset GitHub Releases. It retains no executable artifact.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate or publish an official release.
        required: true
        default: validate
        type: choice
        options:
          - validate
          - publish
  repository_dispatch:
    types:
      - official-release-published

permissions: {}

env:
  # Resolve the manifest's explicit `crates-io` publish allowlist by name.
  CARGO_REGISTRIES_CRATES_IO_INDEX: https://github.com/rust-lang/crates.io-index

# Publication is resumable and its authenticated receiver is serialized behind
# the originating run. Neither path is payload-controlled.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-readiness:
    name: Validate source-only release readiness
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          (inputs.operation == 'validate' || inputs.operation == 'publish') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    outputs:
      baseline_commit: ${{ steps.baseline.outputs.commit }}
      baseline_version: ${{ steps.baseline.outputs.version }}
      captured_release_sha: ${{ steps.capture.outputs.captured_release_sha }}
      policy_commit: ${{ steps.capture.outputs.policy_commit }}
      existing_intent: ${{ steps.capture.outputs.existing_intent }}
      existing_intent_check_id: ${{ steps.capture.outputs.existing_intent_check_id }}
      existing_intent_digest: ${{ steps.capture.outputs.existing_intent_digest }}
      plan: ${{ steps.capture.outputs.plan }}
      plan_digest: ${{ steps.capture.outputs.plan_digest }}
      registry_state: ${{ steps.capture.outputs.registry_state }}
    steps:
      - name: Check out dispatch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate exact main invocation
        run: |
          # Release readiness belongs only to the dispatched protected main.
          if [[ "${GITHUB_REF}" != "refs/heads/main" \
            || "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "Official release operations must use exact main." >&2
            exit 1
          fi

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.95.0,stable

      - name: Bind archive reproduction Cargo
        run: |
          archive_cargo="$(rustup which --toolchain 1.95.0 cargo)"
          test -x "${archive_cargo}"
          printf 'YAML_SIGIL_ARCHIVE_CARGO=%s\n' "${archive_cargo}" \
            >>"${GITHUB_ENV}"

      - name: Install exact cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        with:
          version: 1.20.1

      - name: Install and verify release analyzers
        run: cargo +stable xtask release install-tools

      # Preserve current trusted release policy across a recovery checkout.
      - name: Stage current release validator
        run: |
          cargo +stable build --locked --manifest-path xtask/Cargo.toml
          validator="${RUNNER_TEMP}/yaml-sigil-release-xtask"
          install -m 700 xtask/target/debug/xtask "${validator}"
          validator_sha256="$(sha256sum "${validator}" | cut -d ' ' -f 1)"
          printf 'YAML_SIGIL_RELEASE_XTASK=%s\n' "${validator}" \
            >>"${GITHUB_ENV}"
          printf 'YAML_SIGIL_RELEASE_XTASK_SHA256=%s\n' "${validator_sha256}" \
            >>"${GITHUB_ENV}"

      - name: Verify pinned historical source-only Releases
        id: legacy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "${YAML_SIGIL_RELEASE_XTASK}"
          github release-train verify-legacy
          --repository "${GITHUB_REPOSITORY}"
          --policy-commit "${GITHUB_SHA}"

      - name: Configure read-only forge identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo +stable xtask github git-identity configure

      - name: Discover fresh or recoverable release source
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          cargo +stable xtask github release-train discover
          --repository "${GITHUB_REPOSITORY}"
          --commit "${GITHUB_SHA}"

      - name: Check out captured release source
        if: ${{ steps.discover.outputs.captured_release_sha != github.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.discover.outputs.captured_release_sha }}

      # Verify the checkout before changing only local branch metadata. The
      # branch is never pushed; it supplies pinned release-plz's upstream.
      - name: Attach exact source to a local release branch
        env:
          CAPTURED_SHA: ${{ steps.discover.outputs.captured_release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${CAPTURED_SHA}"
          # Pinned release-plz requires a branch with a configured upstream.
          git switch --force-create release-plz-source "${CAPTURED_SHA}"
          git branch --set-upstream-to=origin/main release-plz-source
          test "$(git rev-parse HEAD)" = "${CAPTURED_SHA}"
          test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}')" \
            = "origin/main"

      # Recheck the archive-discovered protected-main ancestor before project
      # execution.
      - name: Verify captured source identity
        env:
          CAPTURED_SHA: ${{ steps.discover.outputs.captured_release_sha }}
          REGISTRY_STATE: ${{ steps.discover.outputs.registry_state }}
        run: |
          test "$(git rev-parse HEAD)" = "${CAPTURED_SHA}"
          # A fresh release must still be exact current main before publication.
          if [[ "${REGISTRY_STATE}" = "absent" ]]; then
            test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d ' ' -f 1)" \
              = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
            "${YAML_SIGIL_RELEASE_XTASK}" release require-current-main \
              --head "${CAPTURED_SHA}" \
              --fetch-url "https://github.com/${GITHUB_REPOSITORY}"
          fi

      - name: Require a committed release version
        run: |
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d ' ' -f 1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          "${YAML_SIGIL_RELEASE_XTASK}" release-version check
          git diff --exit-code

      - name: Prepare the official tagged baseline
        id: baseline
        env:
          CAPTURED_SHA: ${{ steps.discover.outputs.captured_release_sha }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: remote.origin.pushurl
          GIT_CONFIG_VALUE_0: disabled://yaml-sigil-release-readiness
        run: |
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d ' ' -f 1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          current_version="$("${YAML_SIGIL_RELEASE_XTASK}" release-version show)"
          result="${RUNNER_TEMP}/baseline-result.json"
          "${YAML_SIGIL_RELEASE_XTASK}" release baseline prepare \
            --source-root "${GITHUB_WORKSPACE}" \
            --head "${CAPTURED_SHA}" \
            --exclude-version "${current_version}" \
            --output "${RUNNER_TEMP}/official-release-baseline" \
            --result "${result}" \
            --expected-fetch-url "https://github.com/${GITHUB_REPOSITORY}" \
            --expected-push-url "${GIT_CONFIG_VALUE_0}"
          jq --raw-output \
            '"commit=\(.commit)",
             "manifest=\(.manifest)",
             "version=\(.version)",
             "inventory=\(.inventory)"' \
            "${result}" >>"${GITHUB_OUTPUT}"

      - name: Require the tagged baseline on crates.io
        run: |
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d ' ' -f 1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          "${YAML_SIGIL_RELEASE_XTASK}" release verify-registry \
            --check-version "${{ steps.baseline.outputs.version }}" \
            yaml-sigil-traits

      - name: Check release API compatibility
        run: |
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d ' ' -f 1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          current_version="$("${YAML_SIGIL_RELEASE_XTASK}" release-version show)"
          intent="$("${YAML_SIGIL_RELEASE_XTASK}" release-version intent \
            --published "${{ steps.baseline.outputs.version }}")"
          "${YAML_SIGIL_RELEASE_XTASK}" release-version check-compatibility \
            --baseline-manifest "${{ steps.baseline.outputs.manifest }}" \
            --current-manifest Cargo.toml \
            --package yaml-sigil-traits \
            --expected-baseline-version "${{ steps.baseline.outputs.version }}" \
            --expected-current-version "${current_version}" \
            --intent "${intent}"

      - name: Require the exact source-package inventory
        run: |
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d ' ' -f 1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          "${YAML_SIGIL_RELEASE_XTASK}" release check-packages yaml-sigil-traits

      - name: Package with Cargo
        run: cargo +stable package

      - name: Require exact merged release authorization
        env:
          CAPTURED_SHA: ${{ steps.discover.outputs.captured_release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d ' ' -f 1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          "${YAML_SIGIL_RELEASE_XTASK}" github release-source authorize \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${CAPTURED_SHA}" \
            --baseline-version "${{ steps.baseline.outputs.version }}" \
            --baseline-commit "${{ steps.baseline.outputs.commit }}"

      - name: Prepare source-only publication configuration
        run: |
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d ' ' -f 1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          "${YAML_SIGIL_RELEASE_XTASK}" release prepare-publication-config \
            --output "${RUNNER_TEMP}/release-plz-publication.toml"

      - name: Validate release-plz publication plan
        env:
          CAPTURED_SHA: ${{ steps.discover.outputs.captured_release_sha }}
          GIT_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "${CAPTURED_SHA}"
          # Dry-run exercises package selection without OIDC or writes.
          release-plz release \
            --dry-run \
            --forge github \
            --repo-url "https://github.com/${GITHUB_REPOSITORY}" \
            --config "${RUNNER_TEMP}/release-plz-publication.toml" \
            --manifest-path Cargo.toml
          test "$(git rev-parse HEAD)" = "${CAPTURED_SHA}"

      - name: Capture canonical release plan
        id: capture
        env:
          CAPTURED_SHA: ${{ steps.discover.outputs.captured_release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d ' ' -f 1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          "${YAML_SIGIL_RELEASE_XTASK}" github release-train capture \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${CAPTURED_SHA}" \
            --policy-commit "${GITHUB_SHA}" \
            --legacy-inventory-sha256 \
              "${{ steps.legacy.outputs.legacy_inventory_digest }}" \
            --baseline-version "${{ steps.baseline.outputs.version }}" \
            --baseline-commit "${{ steps.baseline.outputs.commit }}"

  publication:
    name: Publish source crate
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          inputs.operation == 'publish' }}
    needs: release-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io
    permissions:
      checks: read
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      baseline_commit: ${{ steps.baseline.outputs.commit }}
      baseline_version: ${{ steps.baseline.outputs.version }}
      captured_release_sha: ${{ steps.capture.outputs.captured_release_sha }}
      policy_commit: ${{ steps.capture.outputs.policy_commit }}
      existing_intent: ${{ steps.capture.outputs.existing_intent }}
      existing_intent_check_id: ${{ steps.capture.outputs.existing_intent_check_id }}
      existing_intent_digest: ${{ steps.capture.outputs.existing_intent_digest }}
      plan: ${{ steps.capture.outputs.plan }}
      plan_digest: ${{ steps.capture.outputs.plan_digest }}
      registry_state: ${{ steps.capture.outputs.registry_state }}
    steps:
      - name: Check out dispatch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.95.0,stable

      - name: Bind archive reproduction Cargo
        run: |
          archive_cargo="$(rustup which --toolchain 1.95.0 cargo)"
          test -x "${archive_cargo}"
          printf 'YAML_SIGIL_ARCHIVE_CARGO=%s\n' "${archive_cargo}" \
            >>"${GITHUB_ENV}"

      - name: Install exact cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        with:
          version: 1.20.1

      - name: Install and verify release analyzers
        run: cargo +stable xtask release install-tools

      # Preserve current trusted release policy across a recovery checkout.
      - name: Stage current release validator
        run: |
          cargo +stable build --locked --manifest-path xtask/Cargo.toml
          validator="${RUNNER_TEMP}/yaml-sigil-release-xtask"
          install -m 700 xtask/target/debug/xtask "${validator}"
          validator_sha256="$(sha256sum "${validator}" | cut -d ' ' -f 1)"
          printf 'YAML_SIGIL_RELEASE_XTASK=%s\n' "${validator}" \
            >>"${GITHUB_ENV}"
          printf 'YAML_SIGIL_RELEASE_XTASK_SHA256=%s\n' "${validator_sha256}" \
            >>"${GITHUB_ENV}"

      - name: Recheck pinned historical source-only Releases
        id: legacy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "${YAML_SIGIL_RELEASE_XTASK}"
          github release-train verify-legacy
          --repository "${GITHUB_REPOSITORY}"
          --policy-commit "${GITHUB_SHA}"

      - name: Configure protected publication forge identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo +stable xtask github git-identity configure

      - name: Rediscover fresh or partial release source
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          cargo +stable xtask github release-train discover
          --repository "${GITHUB_REPOSITORY}"
          --commit "${GITHUB_SHA}"

      - name: Check out captured release source
        if: ${{ steps.discover.outputs.captured_release_sha != github.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.discover.outputs.captured_release_sha }}

      # Verify the checkout before changing only local branch metadata. The
      # branch is never pushed; it supplies pinned release-plz's upstream.
      - name: Attach exact source to a local release branch
        env:
          CAPTURED_SHA: ${{ steps.discover.outputs.captured_release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${CAPTURED_SHA}"
          # Pinned release-plz requires a branch with a configured upstream.
          git switch --force-create release-plz-source "${CAPTURED_SHA}"
          git branch --set-upstream-to=origin/main release-plz-source
          test "$(git rev-parse HEAD)" = "${CAPTURED_SHA}"
          test "$(git rev-parse --abbrev-ref --symbolic-full-name '@{upstream}')" \
            = "origin/main"

      - name: Recheck captured source and committed version
        env:
          CAPTURED_SHA: ${{ steps.discover.outputs.captured_release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${CAPTURED_SHA}"
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d ' ' -f 1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          "${YAML_SIGIL_RELEASE_XTASK}" release-version check
          git diff --exit-code

      - name: Prepare the official tagged baseline
        id: baseline
        env:
          CAPTURED_SHA: ${{ steps.discover.outputs.captured_release_sha }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: remote.origin.pushurl
          GIT_CONFIG_VALUE_0: disabled://yaml-sigil-release-publication
        run: |
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d ' ' -f 1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          current_version="$("${YAML_SIGIL_RELEASE_XTASK}" release-version show)"
          result="${RUNNER_TEMP}/baseline-result.json"
          "${YAML_SIGIL_RELEASE_XTASK}" release baseline prepare \
            --source-root "${GITHUB_WORKSPACE}" \
            --head "${CAPTURED_SHA}" \
            --exclude-version "${current_version}" \
            --output "${RUNNER_TEMP}/official-release-baseline" \
            --result "${result}" \
            --expected-fetch-url "https://github.com/${GITHUB_REPOSITORY}" \
            --expected-push-url "${GIT_CONFIG_VALUE_0}"
          jq --raw-output \
            '"commit=\(.commit)",
             "manifest=\(.manifest)",
             "version=\(.version)",
             "inventory=\(.inventory)"' \
            "${result}" >>"${GITHUB_OUTPUT}"

      - name: Repeat publication authority and package checks
        env:
          CAPTURED_SHA: ${{ steps.discover.outputs.captured_release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d ' ' -f 1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          "${YAML_SIGIL_RELEASE_XTASK}" release verify-registry \
            --check-version "${{ steps.baseline.outputs.version }}" \
            yaml-sigil-traits
          current_version="$("${YAML_SIGIL_RELEASE_XTASK}" release-version show)"
          intent="$("${YAML_SIGIL_RELEASE_XTASK}" release-version intent \
            --published "${{ steps.baseline.outputs.version }}")"
          "${YAML_SIGIL_RELEASE_XTASK}" release-version check-compatibility \
            --baseline-manifest "${{ steps.baseline.outputs.manifest }}" \
            --current-manifest Cargo.toml \
            --package yaml-sigil-traits \
            --expected-baseline-version "${{ steps.baseline.outputs.version }}" \
            --expected-current-version "${current_version}" \
            --intent "${intent}"
          "${YAML_SIGIL_RELEASE_XTASK}" release check-packages yaml-sigil-traits
          cargo +stable package
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d ' ' -f 1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          "${YAML_SIGIL_RELEASE_XTASK}" github release-source authorize \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${CAPTURED_SHA}" \
            --baseline-version "${{ steps.baseline.outputs.version }}" \
            --baseline-commit "${{ steps.baseline.outputs.commit }}"

      - name: Prepare source-only publication configuration
        run: |
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d ' ' -f 1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          "${YAML_SIGIL_RELEASE_XTASK}" release prepare-publication-config \
            --output "${RUNNER_TEMP}/release-plz-publication.toml"

      - name: Capture canonical publication plan
        id: capture
        env:
          CAPTURED_SHA: ${{ steps.discover.outputs.captured_release_sha }}
          GH_TOKEN: ${{ github.token }}
          REGISTRY_STATE: ${{ steps.discover.outputs.registry_state }}
        run: |
          # A fresh plan is captured only from exact current protected main.
          if [[ "${REGISTRY_STATE}" = "absent" ]]; then
            test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d ' ' -f 1)" \
              = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
            "${YAML_SIGIL_RELEASE_XTASK}" release require-current-main \
              --head "${CAPTURED_SHA}" \
              --fetch-url "https://github.com/${GITHUB_REPOSITORY}"
          fi
          test "$(git rev-parse HEAD)" = "${CAPTURED_SHA}"
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d ' ' -f 1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          "${YAML_SIGIL_RELEASE_XTASK}" github release-train capture \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${CAPTURED_SHA}" \
            --policy-commit "${GITHUB_SHA}" \
            --legacy-inventory-sha256 \
              "${{ steps.legacy.outputs.legacy_inventory_digest }}" \
            --baseline-version "${{ steps.baseline.outputs.version }}" \
            --baseline-commit "${{ steps.baseline.outputs.commit }}"
          test "$(git rev-parse HEAD)" = "${CAPTURED_SHA}"

      - name: Require the frozen readiness plan to remain exact
        env:
          BASELINE_COMMIT: ${{ steps.baseline.outputs.commit }}
          BASELINE_VERSION: ${{ steps.baseline.outputs.version }}
          CAPTURED_SHA: ${{ steps.capture.outputs.captured_release_sha }}
          PLAN: ${{ steps.capture.outputs.plan }}
          PLAN_DIGEST: ${{ steps.capture.outputs.plan_digest }}
          POLICY_COMMIT: ${{ steps.capture.outputs.policy_commit }}
          READINESS_BASELINE_COMMIT: ${{ needs.release-readiness.outputs.baseline_commit }}
          READINESS_BASELINE_VERSION: ${{ needs.release-readiness.outputs.baseline_version }}
          READINESS_CAPTURED_SHA: ${{ needs.release-readiness.outputs.captured_release_sha }}
          READINESS_PLAN: ${{ needs.release-readiness.outputs.plan }}
          READINESS_PLAN_DIGEST: ${{ needs.release-readiness.outputs.plan_digest }}
          READINESS_POLICY_COMMIT: ${{ needs.release-readiness.outputs.policy_commit }}
          READINESS_REGISTRY_STATE: ${{ needs.release-readiness.outputs.registry_state }}
          REGISTRY_STATE: ${{ steps.capture.outputs.registry_state }}
        run: |
          test "${BASELINE_COMMIT}" = "${READINESS_BASELINE_COMMIT}"
          test "${BASELINE_VERSION}" = "${READINESS_BASELINE_VERSION}"
          test "${CAPTURED_SHA}" = "${READINESS_CAPTURED_SHA}"
          test "${PLAN}" = "${READINESS_PLAN}"
          test "${PLAN_DIGEST}" = "${READINESS_PLAN_DIGEST}"
          test "${POLICY_COMMIT}" = "${READINESS_POLICY_COMMIT}"
          test "${REGISTRY_STATE}" = "${READINESS_REGISTRY_STATE}"

      # This is the last read-only gate before release-plz receives registry
      # authority. It requires both App attestations and current protected main.
      - name: Await exact pre-publication App authority
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ steps.capture.outputs.plan }}
          PLAN_DIGEST: ${{ steps.capture.outputs.plan_digest }}
          POLICY_COMMIT: ${{ steps.capture.outputs.policy_commit }}
        run: >-
          "${YAML_SIGIL_RELEASE_XTASK}"
          github release-train await-release-authority
          --repository "${GITHUB_REPOSITORY}"
          --plan "${PLAN}"
          --plan-digest "${PLAN_DIGEST}"
          --policy-commit "${POLICY_COMMIT}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: Publish missing source package and await exact registry state
        id: publish
        env:
          CAPTURED_SHA: ${{ steps.capture.outputs.captured_release_sha }}
          GH_TOKEN: ${{ github.token }}
          GIT_TOKEN: ${{ github.token }}
          PLAN: ${{ steps.capture.outputs.plan }}
          PLAN_DIGEST: ${{ steps.capture.outputs.plan_digest }}
          REGISTRY_STATE: ${{ steps.capture.outputs.registry_state }}
        run: |
          publisher_status=0
          # Complete recovery performs no registry mutation; other prefixes may.
          case "${REGISTRY_STATE}" in
            complete)
              echo "The exact crate is already published; skipping registry mutation."
              ;;
            absent|partial)
              test "$(git rev-parse HEAD)" = "${CAPTURED_SHA}"
              set +e
              # Pinned release-plz has source-crate publication authority only.
              release-plz release \
                --forge github \
                --repo-url "https://github.com/${GITHUB_REPOSITORY}" \
                --config "${RUNNER_TEMP}/release-plz-publication.toml" \
                --manifest-path Cargo.toml
              publisher_status="$?"
              set -e
              test "$(git rev-parse HEAD)" = "${CAPTURED_SHA}"
              ;;
            *)
              echo "The captured registry state is invalid." >&2
              exit 1
              ;;
          esac
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d ' ' -f 1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          "${YAML_SIGIL_RELEASE_XTASK}" github release-train wait \
            --repository "${GITHUB_REPOSITORY}" \
            --plan "${PLAN}" \
            --plan-digest "${PLAN_DIGEST}"
          # Exact complete registry state, not the publisher exit alone, wins.
          if [[ "${publisher_status}" -ne 0 ]]; then
            echo "release-plz exited ${publisher_status}; exact registry confirmation recovered the run."
          fi
          printf 'publisher_status=%s\n' "${publisher_status}" >>"${GITHUB_OUTPUT}"

  release-intent:
    name: Attest release finalization intent
    if: >-
      ${{ needs.release-readiness.result == 'success' &&
          needs.release-readiness.outputs.plan != '' &&
          (inputs.operation == 'validate' || inputs.operation == 'publish') }}
    needs: release-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: protected-automation
    permissions:
      actions: read
      checks: read
      contents: read
      deployments: read
      pull-requests: read
    outputs:
      binary_sha256: ${{ steps.compile.outputs.binary_sha256 }}
      intent: ${{ steps.create-intent.outputs.intent }}
      intent_check_id: ${{ steps.create-intent.outputs.intent_check_id }}
      intent_digest: ${{ steps.create-intent.outputs.intent_digest }}
      intent_external_id: ${{ steps.create-intent.outputs.intent_external_id }}
      settings_authorization: ${{ steps.create-settings.outputs.settings_authorization }}
      settings_authorization_check_id: ${{ steps.create-settings.outputs.settings_authorization_check_id }}
      settings_authorization_digest: ${{ steps.create-settings.outputs.settings_authorization_digest }}
      settings_authorization_external_id: ${{ steps.create-settings.outputs.settings_authorization_external_id }}
    steps:
      - name: Check out protected release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.release-readiness.outputs.policy_commit }}

      - name: Verify exact policy checkout
        env:
          POLICY_COMMIT: ${{ needs.release-readiness.outputs.policy_commit }}
        run: test "$(git rev-parse HEAD)" = "${POLICY_COMMIT}"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.95.0,stable

      - name: Stage protected typed release attestor
        id: compile
        run: |
          cargo +stable build --locked --release --manifest-path xtask/Cargo.toml
          validator="${RUNNER_TEMP}/yaml-sigil-release-xtask"
          install -m 700 xtask/target/release/xtask "${validator}"
          validator_sha256="$(sha256sum "${validator}" | cut -d' ' -f1)"
          printf 'YAML_SIGIL_RELEASE_XTASK=%s\n' "${validator}" \
            >>"${GITHUB_ENV}"
          printf 'YAML_SIGIL_RELEASE_XTASK_SHA256=%s\n' "${validator_sha256}" \
            >>"${GITHUB_ENV}"
          printf 'binary_sha256=%s\n' "${validator_sha256}" \
            >>"${GITHUB_OUTPUT}"

      # The repository-admin reviewer performs the privileged live read with
      # their existing gh identity, then copies the exact approval_comment.
      - name: Display repository-admin settings evidence request
        env:
          POLICY_COMMIT: ${{ needs.release-readiness.outputs.policy_commit }}
        run: >-
          "${YAML_SIGIL_RELEASE_XTASK}"
          github release-train settings-request
          --repository "${GITHUB_REPOSITORY}"
          --policy-commit "${POLICY_COMMIT}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: Authenticate the exact crates.io approval
        id: settings-review
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_COMMIT: ${{ needs.release-readiness.outputs.policy_commit }}
        run: >-
          "${YAML_SIGIL_RELEASE_XTASK}"
          github release-train await-settings-review
          --repository "${GITHUB_REPOSITORY}"
          --policy-commit "${POLICY_COMMIT}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: Check out captured trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.release-readiness.outputs.captured_release_sha }}

      - name: Verify exact captured checkout
        env:
          CAPTURED_SHA: ${{ needs.release-readiness.outputs.captured_release_sha }}
        run: test "$(git rev-parse HEAD)" = "${CAPTURED_SHA}"

      - name: Bind archive reproduction Cargo
        run: |
          archive_cargo="$(rustup which --toolchain 1.95.0 cargo)"
          test -x "${archive_cargo}"
          printf 'YAML_SIGIL_ARCHIVE_CARGO=%s\n' "${archive_cargo}" \
            >>"${GITHUB_ENV}"

      - name: Recompute release plan
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.release-readiness.outputs.plan }}
          PLAN_DIGEST: ${{ needs.release-readiness.outputs.plan_digest }}
        run: |
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d' ' -f1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          "${YAML_SIGIL_RELEASE_XTASK}" github release-train verify \
            --repository "${GITHUB_REPOSITORY}" \
            --plan "${PLAN}" \
            --plan-digest "${PLAN_DIGEST}" \
            --baseline-version "${{ needs.release-readiness.outputs.baseline_version }}" \
            --baseline-commit "${{ needs.release-readiness.outputs.baseline_commit }}"

      - name: Preserve or prepare the durable original intent
        id: prepare-intent
        env:
          EXISTING_INTENT: ${{ needs.release-readiness.outputs.existing_intent }}
          EXISTING_INTENT_CHECK_ID: ${{ needs.release-readiness.outputs.existing_intent_check_id }}
          EXISTING_INTENT_DIGEST: ${{ needs.release-readiness.outputs.existing_intent_digest }}
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.release-readiness.outputs.plan }}
          PLAN_DIGEST: ${{ needs.release-readiness.outputs.plan_digest }}
          SETTINGS_EVIDENCE: ${{ steps.settings-review.outputs.settings_evidence }}
          SETTINGS_REVIEW_ID: ${{ steps.settings-review.outputs.settings_review_id }}
          SETTINGS_REVIEWER_ID: ${{ steps.settings-review.outputs.settings_reviewer_id }}
          SETTINGS_REVIEWER_LOGIN: ${{ steps.settings-review.outputs.settings_reviewer_login }}
        run: |
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d' ' -f1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          # Recovery retains the original plan and intent; a fresh train binds
          # the same reviewed settings to its first durable intent.
          case "${EXISTING_INTENT}" in
            '')
              "${YAML_SIGIL_RELEASE_XTASK}" github release-train prepare-intent \
                --plan "${PLAN}" \
                --plan-digest "${PLAN_DIGEST}" \
                --origin-run-id "${GITHUB_RUN_ID}" \
                --origin-run-attempt "${GITHUB_RUN_ATTEMPT}" \
                --settings-evidence "${SETTINGS_EVIDENCE}" \
                --settings-review-id "${SETTINGS_REVIEW_ID}" \
                --settings-reviewer-id "${SETTINGS_REVIEWER_ID}" \
                --settings-reviewer-login "${SETTINGS_REVIEWER_LOGIN}"
              ;;
            *)
              test "$(printf '%s' "${EXISTING_INTENT}" | sha256sum | cut -d' ' -f1)" \
                = "${EXISTING_INTENT_DIGEST}"
              "${YAML_SIGIL_RELEASE_XTASK}" github release-train verify-intent \
                --repository "${GITHUB_REPOSITORY}" \
                --plan "${PLAN}" \
                --plan-digest "${PLAN_DIGEST}" \
                --intent "${EXISTING_INTENT}" \
                --check-id "${EXISTING_INTENT_CHECK_ID}"
              ;;
          esac

      - name: Prepare current-policy settings authorization
        id: prepare-settings
        env:
          PLAN: ${{ needs.release-readiness.outputs.plan }}
          PLAN_DIGEST: ${{ needs.release-readiness.outputs.plan_digest }}
          POLICY_COMMIT: ${{ needs.release-readiness.outputs.policy_commit }}
          SETTINGS_EVIDENCE: ${{ steps.settings-review.outputs.settings_evidence }}
          SETTINGS_REVIEW_ID: ${{ steps.settings-review.outputs.settings_review_id }}
          SETTINGS_REVIEWER_ID: ${{ steps.settings-review.outputs.settings_reviewer_id }}
          SETTINGS_REVIEWER_LOGIN: ${{ steps.settings-review.outputs.settings_reviewer_login }}
        run: >-
          "${YAML_SIGIL_RELEASE_XTASK}"
          github release-train prepare-settings-authorization
          --repository "${GITHUB_REPOSITORY}"
          --plan "${PLAN}"
          --plan-digest "${PLAN_DIGEST}"
          --policy-commit "${POLICY_COMMIT}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"
          --settings-evidence "${SETTINGS_EVIDENCE}"
          --settings-review-id "${SETTINGS_REVIEW_ID}"
          --settings-reviewer-id "${SETTINGS_REVIEWER_ID}"
          --settings-reviewer-login "${SETTINGS_REVIEWER_LOGIN}"

      # Source is no longer needed once both canonical attestations exist.
      - name: Discard source checkout before token minting
        run: |
          rm -rf "${GITHUB_WORKSPACE}"
          mkdir -m 700 "${GITHUB_WORKSPACE}"
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d' ' -f1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"

      - name: Create checks-only repository token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YAML_SIGIL_RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.YAML_SIGIL_RELEASE_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Create current-policy settings authorization Check
        id: create-settings
        working-directory: ${{ runner.temp }}
        env:
          AUTHORIZATION: ${{ steps.prepare-settings.outputs.settings_authorization }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PLAN: ${{ needs.release-readiness.outputs.plan }}
          PLAN_DIGEST: ${{ needs.release-readiness.outputs.plan_digest }}
          POLICY_COMMIT: ${{ needs.release-readiness.outputs.policy_commit }}
        run: >-
          "${YAML_SIGIL_RELEASE_XTASK}"
          github release-train create-settings-authorization
          --repository "${GITHUB_REPOSITORY}"
          --plan "${PLAN}"
          --plan-digest "${PLAN_DIGEST}"
          --policy-commit "${POLICY_COMMIT}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"
          --authorization "${AUTHORIZATION}"
          --expected-app-slug "${{ steps.app-token.outputs.app-slug }}"
          --expected-installation-id "${{ steps.app-token.outputs.installation-id }}"

      - name: Create or verify durable original intent Check
        id: create-intent
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INTENT: ${{ steps.prepare-intent.outputs.intent }}
          PLAN: ${{ needs.release-readiness.outputs.plan }}
          PLAN_DIGEST: ${{ needs.release-readiness.outputs.plan_digest }}
        run: >-
          "${YAML_SIGIL_RELEASE_XTASK}"
          github release-train create-intent
          --repository "${GITHUB_REPOSITORY}"
          --plan "${PLAN}"
          --plan-digest "${PLAN_DIGEST}"
          --intent "${INTENT}"
          --expected-app-slug "${{ steps.app-token.outputs.app-slug }}"
          --expected-installation-id "${{ steps.app-token.outputs.installation-id }}"

  authority-validation:
    name: Validate release authority handshake
    if: >-
      ${{ needs.release-readiness.result == 'success' &&
          needs.release-readiness.outputs.plan != '' &&
          inputs.operation == 'validate' }}
    needs: release-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      checks: read
      contents: read
    steps:
      - name: Check out exact protected release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.release-readiness.outputs.policy_commit }}

      - name: Verify exact policy checkout
        env:
          POLICY_COMMIT: ${{ needs.release-readiness.outputs.policy_commit }}
        run: test "$(git rev-parse HEAD)" = "${POLICY_COMMIT}"

      - name: Set up current trusted Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: stable

      - name: Compile validation-only authority verifier
        run: cargo +stable build --locked --release --manifest-path xtask/Cargo.toml

      # This reproduces the final release authority gate without OIDC,
      # release-plz, registry access, tags, Releases, or retained artifacts.
      - name: Require exact validation-only App authority
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.release-readiness.outputs.plan }}
          PLAN_DIGEST: ${{ needs.release-readiness.outputs.plan_digest }}
          POLICY_COMMIT: ${{ needs.release-readiness.outputs.policy_commit }}
        run: >-
          cargo +stable xtask github release-train await-release-authority
          --repository "${GITHUB_REPOSITORY}"
          --plan "${PLAN}"
          --plan-digest "${PLAN_DIGEST}"
          --policy-commit "${POLICY_COMMIT}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"

  release-finalizer:
    name: Create immutable source-only release objects
    if: >-
      ${{ needs.publication.result == 'success' &&
          needs.release-intent.result == 'success' }}
    needs:
      - publication
      - release-intent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: protected-automation
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      binary_sha256: ${{ steps.compile.outputs.binary_sha256 }}
      complete: ${{ steps.finalize.outputs.complete }}
      finalized_entries: ${{ steps.finalize.outputs.finalized_entries }}
      notification_required: ${{ steps.finalize.outputs.notification_required }}
    steps:
      - name: Check out protected release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.publication.outputs.policy_commit }}

      - name: Verify exact policy checkout
        env:
          POLICY_COMMIT: ${{ needs.publication.outputs.policy_commit }}
        run: test "$(git rev-parse HEAD)" = "${POLICY_COMMIT}"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.95.0,stable

      - name: Recheck pinned historical source-only Releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POLICY_COMMIT: ${{ needs.publication.outputs.policy_commit }}
        run: >-
          cargo +stable xtask github release-train verify-legacy
          --repository "${GITHUB_REPOSITORY}"
          --policy-commit "${POLICY_COMMIT}"

      - name: Stage protected checkout-independent finalizer
        run: |
          cargo +stable build --locked --release --manifest-path xtask/Cargo.toml
          validator="${RUNNER_TEMP}/yaml-sigil-release-xtask"
          install -m 700 xtask/target/release/xtask "${validator}"
          validator_sha256="$(sha256sum "${validator}" | cut -d' ' -f1)"
          printf 'YAML_SIGIL_RELEASE_XTASK=%s\n' "${validator}" \
            >>"${GITHUB_ENV}"
          printf 'YAML_SIGIL_RELEASE_XTASK_SHA256=%s\n' "${validator_sha256}" \
            >>"${GITHUB_ENV}"

      - name: Check out captured trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.publication.outputs.captured_release_sha }}

      - name: Verify exact captured checkout
        env:
          CAPTURED_SHA: ${{ needs.publication.outputs.captured_release_sha }}
        run: test "$(git rev-parse HEAD)" = "${CAPTURED_SHA}"

      - name: Bind archive reproduction Cargo
        run: |
          archive_cargo="$(rustup which --toolchain 1.95.0 cargo)"
          test -x "${archive_cargo}"
          printf 'YAML_SIGIL_ARCHIVE_CARGO=%s\n' "${archive_cargo}" \
            >>"${GITHUB_ENV}"

      - name: Recompute plan and verify both App authorities
        env:
          AUTHORIZATION: ${{ needs.release-intent.outputs.settings_authorization }}
          GH_TOKEN: ${{ github.token }}
          INTENT: ${{ needs.release-intent.outputs.intent }}
          PLAN: ${{ needs.publication.outputs.plan }}
          PLAN_DIGEST: ${{ needs.publication.outputs.plan_digest }}
          POLICY_COMMIT: ${{ needs.publication.outputs.policy_commit }}
        run: |
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d' ' -f1)" \
            = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          "${YAML_SIGIL_RELEASE_XTASK}" github release-train verify \
            --repository "${GITHUB_REPOSITORY}" \
            --plan "${PLAN}" \
            --plan-digest "${PLAN_DIGEST}" \
            --baseline-version "${{ needs.publication.outputs.baseline_version }}" \
            --baseline-commit "${{ needs.publication.outputs.baseline_commit }}"
          "${YAML_SIGIL_RELEASE_XTASK}" github release-train verify-intent \
            --repository "${GITHUB_REPOSITORY}" \
            --plan "${PLAN}" \
            --plan-digest "${PLAN_DIGEST}" \
            --intent "${INTENT}" \
            --check-id "${{ needs.release-intent.outputs.intent_check_id }}"
          "${YAML_SIGIL_RELEASE_XTASK}" \
            github release-train verify-settings-authorization \
            --repository "${GITHUB_REPOSITORY}" \
            --plan "${PLAN}" \
            --plan-digest "${PLAN_DIGEST}" \
            --policy-commit "${POLICY_COMMIT}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --authorization "${AUTHORIZATION}" \
            --check-id \
              "${{ needs.release-intent.outputs.settings_authorization_check_id }}"

      - name: Bind checkout-independent finalizer
        id: compile
        run: |
          binary_sha256="$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d' ' -f1)"
          test "${binary_sha256}" = "${YAML_SIGIL_RELEASE_XTASK_SHA256}"
          printf 'binary_sha256=%s\n' "${binary_sha256}" >>"${GITHUB_OUTPUT}"
          rm -rf "${GITHUB_WORKSPACE}"
          mkdir -m 700 "${GITHUB_WORKSPACE}"
          test "$(sha256sum "${YAML_SIGIL_RELEASE_XTASK}" | cut -d' ' -f1)" \
            = "${binary_sha256}"

      - name: Create finalizer repository token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YAML_SIGIL_RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.YAML_SIGIL_RELEASE_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: read
          permission-contents: write

      - name: Finalize exact published registry prefix
        id: finalize
        working-directory: ${{ runner.temp }}
        env:
          AUTHORIZATION: ${{ needs.release-intent.outputs.settings_authorization }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INTENT: ${{ needs.release-intent.outputs.intent }}
          PLAN: ${{ needs.publication.outputs.plan }}
          PLAN_DIGEST: ${{ needs.publication.outputs.plan_digest }}
          POLICY_COMMIT: ${{ needs.publication.outputs.policy_commit }}
        run: >-
          "${YAML_SIGIL_RELEASE_XTASK}"
          github release-train finalize
          --repository "${GITHUB_REPOSITORY}"
          --plan "${PLAN}"
          --plan-digest "${PLAN_DIGEST}"
          --policy-commit "${POLICY_COMMIT}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"
          --intent "${INTENT}"
          --intent-check-id "${{ needs.release-intent.outputs.intent_check_id }}"
          --settings-authorization "${AUTHORIZATION}"
          --settings-authorization-check-id
          "${{ needs.release-intent.outputs.settings_authorization_check_id }}"
          --expected-app-slug "${{ steps.app-token.outputs.app-slug }}"
          --expected-installation-id "${{ steps.app-token.outputs.installation-id }}"

  release-notification:
    name: Emit complete release train notification
    if: >-
      ${{ needs.release-finalizer.result == 'success' &&
          needs.release-finalizer.outputs.complete == 'true' &&
          needs.release-finalizer.outputs.notification_required == 'true' }}
    needs:
      - publication
      - release-intent
      - release-finalizer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: protected-automation
    permissions:
      contents: read
    steps:
      - name: Check out exact protected release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.publication.outputs.policy_commit }}

      - name: Verify exact protected release policy
        env:
          POLICY_COMMIT: ${{ needs.publication.outputs.policy_commit }}
        run: test "$(git rev-parse HEAD)" = "${POLICY_COMMIT}"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: stable

      # Compile only exact protected-main Rust policy before token minting.
      - name: Compile protected typed notifier
        run: |
          cargo +stable build --locked --release --manifest-path xtask/Cargo.toml
          install -m 700 xtask/target/release/xtask \
            "${RUNNER_TEMP}/yaml-sigil-release-xtask"
          binary_sha256="$(sha256sum "${RUNNER_TEMP}/yaml-sigil-release-xtask" \
            | cut -d' ' -f1)"
          test "$(sha256sum "${RUNNER_TEMP}/yaml-sigil-release-xtask" \
            | cut -d' ' -f1)" = "${binary_sha256}"

      - name: Create notification-only repository token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YAML_SIGIL_RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.YAML_SIGIL_RELEASE_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: read
          permission-contents: write

      - name: Dispatch exact complete release train
        working-directory: ${{ runner.temp }}
        env:
          AUTHORIZATION: ${{ needs.release-intent.outputs.settings_authorization }}
          FINALIZED_ENTRIES: ${{ needs.release-finalizer.outputs.finalized_entries }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INTENT: ${{ needs.release-intent.outputs.intent }}
          PLAN: ${{ needs.publication.outputs.plan }}
          PLAN_DIGEST: ${{ needs.publication.outputs.plan_digest }}
          POLICY_COMMIT: ${{ needs.publication.outputs.policy_commit }}
        run: >-
          "${RUNNER_TEMP}/yaml-sigil-release-xtask"
          github release-train notify
          --repository "${GITHUB_REPOSITORY}"
          --plan "${PLAN}"
          --plan-digest "${PLAN_DIGEST}"
          --policy-commit "${POLICY_COMMIT}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"
          --intent "${INTENT}"
          --intent-check-id "${{ needs.release-intent.outputs.intent_check_id }}"
          --settings-authorization "${AUTHORIZATION}"
          --settings-authorization-check-id
          "${{ needs.release-intent.outputs.settings_authorization_check_id }}"
          --finalized-entries "${FINALIZED_ENTRIES}"
          --expected-app-slug "${{ steps.app-token.outputs.app-slug }}"
          --expected-installation-id "${{ steps.app-token.outputs.installation-id }}"

  release-proposal:
    name: Receive authenticated release notification
    if: >-
      ${{ github.event_name == 'repository_dispatch' &&
          github.event.action == 'official-release-published' }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-proposal.yml
    with:
      source-event: repository_dispatch
      mode: next-candidate
      bump: patch
    secrets: inherit
