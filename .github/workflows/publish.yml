name: Publish

# This workflow distributes one crates.io source package and creates an
# annotated version tag plus a source-only GitHub Release. It builds, uploads,
# and retains no executable artifact.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate or publish an official release.
        required: true
        default: validate
        type: choice
        options:
          - validate
          - publish

permissions: {}

env:
  # Resolve the manifest's explicit `crates-io` publish allowlist by name.
  CARGO_REGISTRIES_CRATES_IO_INDEX: https://github.com/rust-lang/crates.io-index

# Publication is resumable, so never cancel a run that may already have
# uploaded a source package while a replacement waits for approval.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validation:
    name: Validate release
    if: ${{ inputs.operation == 'validate' || inputs.operation == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact main invocation
        run: |
          # Official release authority belongs only to exact protected main.
          if [[ "${GITHUB_REF}" != "refs/heads/main" \
            || "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "Official release operations must use exact main." >&2
            exit 1
          fi

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.95.0

      - name: Install exact cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        with:
          version: 1.20.1

      - name: Install and verify release analyzers
        run: cargo xtask release install-tools

      - name: Configure read-only release forge identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask github git-identity configure

      - name: Require a committed release version
        run: |
          cargo xtask release-version check
          git diff --exit-code

      - name: Prepare the official tagged baseline
        id: baseline
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: remote.origin.pushurl
          GIT_CONFIG_VALUE_0: disabled://yaml-sigil-release-proposal
        run: |
          current_version="$(cargo xtask release-version show)"
          result="${RUNNER_TEMP}/baseline-result.json"
          cargo xtask release baseline prepare \
            --head "${GITHUB_SHA}" \
            --exclude-version "${current_version}" \
            --output "${RUNNER_TEMP}/official-release-baseline" \
            --result "${result}" \
            --expected-fetch-url "https://github.com/${GITHUB_REPOSITORY}"
          jq --raw-output \
            '"commit=\(.commit)",
             "manifest=\(.manifest)",
             "version=\(.version)",
             "inventory=\(.inventory)",
             "tags=\(.tags | @json)"' \
            "${result}" >>"${GITHUB_OUTPUT}"

      - name: Require the tagged baseline on crates.io
        run: >-
          cargo xtask release verify-registry
          --check-version "${{ steps.baseline.outputs.version }}"
          yaml-sigil-traits

      - name: Check release API compatibility
        run: |
          current_version="$(cargo xtask release-version show)"
          intent="$(cargo xtask release-version intent \
            --published "${{ steps.baseline.outputs.version }}")"
          cargo xtask release-version check-compatibility \
            --baseline-manifest "${{ steps.baseline.outputs.manifest }}" \
            --current-manifest Cargo.toml \
            --package yaml-sigil-traits \
            --expected-baseline-version "${{ steps.baseline.outputs.version }}" \
            --expected-current-version "${current_version}" \
            --intent "${intent}"

      # `autobins = false` prevents implicit executable targets. Reject an
      # explicit `[[bin]]` target before any release-plz invocation.
      - name: Require a library-only release package
        run: cargo xtask release check-packages yaml-sigil-traits

      - name: Package with Cargo
        run: cargo package

      - name: Require exact merged release authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo xtask github release-source authorize \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --baseline-version "${{ steps.baseline.outputs.version }}" \
            --baseline-commit "${{ steps.baseline.outputs.commit }}"

      # Change only release-plz's publication switch and impossible branch
      # prefix so it cannot replace the already authorized current checkout.
      - name: Prepare checkout-bound release configuration
        run: |
          cargo xtask release prepare-publication-config \
            --output "${RUNNER_TEMP}/release-plz-publication.toml"

      - name: Validate release-plz publication plan
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          cargo xtask release require-current-main \
            --head "${GITHUB_SHA}" \
            --fetch-url "https://github.com/${GITHUB_REPOSITORY}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          # Exercise package selection and forge discovery without OIDC or writes.
          release-plz release \
            --dry-run \
            --forge github \
            --config "${RUNNER_TEMP}/release-plz-publication.toml" \
            --manifest-path Cargo.toml
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

  publication:
    name: Publish release
    if: ${{ inputs.operation == 'publish' }}
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crates-io
    permissions:
      # Create the version tag and source-only Release after publication.
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.95.0

      - name: Install exact cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        with:
          version: 1.20.1

      - name: Install and verify release analyzers
        run: cargo xtask release install-tools

      - name: Configure protected publication forge identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask github git-identity configure

      - name: Recheck the committed release version
        run: |
          cargo xtask release-version check
          git diff --exit-code

      - name: Prepare the official tagged baseline
        id: baseline
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: remote.origin.pushurl
          GIT_CONFIG_VALUE_0: disabled://yaml-sigil-release-proposal
        run: |
          current_version="$(cargo xtask release-version show)"
          result="${RUNNER_TEMP}/baseline-result.json"
          cargo xtask release baseline prepare \
            --head "${GITHUB_SHA}" \
            --exclude-version "${current_version}" \
            --output "${RUNNER_TEMP}/official-release-baseline" \
            --result "${result}" \
            --expected-fetch-url "https://github.com/${GITHUB_REPOSITORY}"
          jq --raw-output \
            '"commit=\(.commit)",
             "manifest=\(.manifest)",
             "version=\(.version)",
             "inventory=\(.inventory)",
             "tags=\(.tags | @json)"' \
            "${result}" >>"${GITHUB_OUTPUT}"

      - name: Require the tagged baseline on crates.io
        run: >-
          cargo xtask release verify-registry
          --check-version "${{ steps.baseline.outputs.version }}"
          yaml-sigil-traits

      - name: Check release API compatibility
        run: |
          current_version="$(cargo xtask release-version show)"
          intent="$(cargo xtask release-version intent \
            --published "${{ steps.baseline.outputs.version }}")"
          cargo xtask release-version check-compatibility \
            --baseline-manifest "${{ steps.baseline.outputs.manifest }}" \
            --current-manifest Cargo.toml \
            --package yaml-sigil-traits \
            --expected-baseline-version "${{ steps.baseline.outputs.version }}" \
            --expected-current-version "${current_version}" \
            --intent "${intent}"

      # Change only release-plz's publication switch and impossible branch
      # prefix so it cannot replace the already authorized current checkout.
      - name: Prepare checkout-bound release configuration
        run: |
          cargo xtask release prepare-publication-config \
            --output "${RUNNER_TEMP}/release-plz-publication.toml"

      - name: Publish with Trusted Publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo xtask release-version show)"
          set +e
          cargo xtask release verify-registry \
            --check-version "${version}" yaml-sigil-traits
          registry_status="$?"
          set -e
          cargo xtask github release-source authorize \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --baseline-version "${{ steps.baseline.outputs.version }}" \
            --baseline-commit "${{ steps.baseline.outputs.commit }}"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=remote.origin.pushurl \
            GIT_CONFIG_VALUE_0=disabled://yaml-sigil-release-proposal \
            cargo xtask release baseline verify \
            --head "${GITHUB_SHA}" \
            --inventory "${{ steps.baseline.outputs.inventory }}" \
            --expected-fetch-url "https://github.com/${GITHUB_REPOSITORY}"
          cargo xtask release require-current-main \
            --head "${GITHUB_SHA}" \
            --fetch-url "https://github.com/${GITHUB_REPOSITORY}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          # Complete registry publication selects recovery. Any absent package
          # permits a fresh or fail-closed resumed Trusted Publishing attempt.
          case "${registry_status}" in
            0)
              cargo xtask github release-objects reconcile \
                --mode recover \
                --repository "${GITHUB_REPOSITORY}" \
                --version "${version}" \
                --commit "${GITHUB_SHA}"
              echo "The exact crate is already published; skipping registry mutation."
              ;;
            3)
              cargo xtask github release-objects reconcile \
                --mode prepublish \
                --repository "${GITHUB_REPOSITORY}" \
                --version "${version}" \
                --commit "${GITHUB_SHA}"
              cargo xtask release require-current-main \
                --head "${GITHUB_SHA}" \
                --fetch-url "https://github.com/${GITHUB_REPOSITORY}"
              test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
              # Exchange only this protected job's OIDC identity, publish the
              # source package, and create its annotated tag and Release.
              release-plz release \
                --forge github \
                --config "${RUNNER_TEMP}/release-plz-publication.toml" \
                --manifest-path Cargo.toml
              test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
              ;;
            *)
              echo "The exact crates.io publication state is invalid." >&2
              exit 1
              ;;
          esac

      - name: Verify crates.io publication
        run: cargo xtask release verify-registry yaml-sigil-traits

      - name: Verify or recover source-only release objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo xtask release-version show)"
          cargo xtask release require-current-main \
            --head "${GITHUB_SHA}" \
            --fetch-url "https://github.com/${GITHUB_REPOSITORY}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          # Recovery can create only missing annotated tags and Releases after
          # it independently rechecks the exact non-yanked registry version.
          cargo xtask github release-objects reconcile \
            --mode recover \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${version}" \
            --commit "${GITHUB_SHA}"

      - name: Request the next release proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo xtask release-version show)"
          jq --null-input --arg version "${version}" \
            '{event_type: "official-release-published", client_payload: {version: $version}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -
