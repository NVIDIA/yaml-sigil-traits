name: Publish

# A main push may qualify one reviewed release. Manual dispatch is either
# validation-only or recovery bound to the original source and run attempt.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Validate protected policy or recover one original main run.
        required: true
        default: validate
        type: choice
        options:
          - validate
          - recover
      source_sha:
        description: Full source SHA; required for validation and recovery.
        required: true
        type: string
      original_run_id:
        description: Original push run ID; required only for recovery.
        required: false
        type: string
      original_run_attempt:
        description: Original push run attempt; required only for recovery.
        required: false
        type: string

permissions: {}

concurrency:
  group: yaml-sigil-publish-v2-${{ github.repository }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify exact release source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.invocation.outputs.mode }}
      qualified: ${{ steps.qualify.outputs.qualified }}
      registry_state: ${{ steps.qualify.outputs.registry_state }}
      source: ${{ steps.qualify.outputs.source }}
      validation_only: ${{ steps.qualify.outputs.validation_only }}
      version: ${{ steps.qualify.outputs.version }}
    steps:
      - name: Bind event inputs before checkout
        id: invocation
        env:
          DISPATCH_OPERATION: ${{ inputs.operation }}
          INPUT_ATTEMPT: ${{ inputs.original_run_attempt }}
          INPUT_RUN_ID: ${{ inputs.original_run_id }}
          INPUT_SOURCE: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          # Select only a current-main push, validation, or fully bounded recovery.
          case "${GITHUB_EVENT_NAME}" in
            push)
              test -z "${INPUT_SOURCE}${INPUT_RUN_ID}${INPUT_ATTEMPT}"
              mode=push
              source="${GITHUB_SHA}"
              ;;
            workflow_dispatch)
              # Dispatch validation has no recovery coordinates; recovery has all three.
              case "${DISPATCH_OPERATION}" in
                validate)
                  [[ "${INPUT_SOURCE}" =~ ^[0-9a-f]{40}$ ]]
                  test "${INPUT_SOURCE}" = "${GITHUB_SHA}"
                  test -z "${INPUT_RUN_ID}${INPUT_ATTEMPT}"
                  mode=validate
                  source="${INPUT_SOURCE}"
                  ;;
                recover)
                  [[ "${INPUT_SOURCE}" =~ ^[0-9a-f]{40}$ ]]
                  [[ "${INPUT_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
                  [[ "${INPUT_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
                  mode=recover
                  source="${INPUT_SOURCE}"
                  ;;
                *)
                  echo "Unsupported publication operation." >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Unsupported publication event." >&2
              exit 1
              ;;
          esac
          printf 'mode=%s\nsource=%s\n' "${mode}" "${source}" >> "${GITHUB_OUTPUT}"

      # The dispatch workflow itself always comes from protected current main.
      - name: Check out protected release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Rust 1.98.0
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.98.0

      - name: Compile protected typed qualifier
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git rev-parse HEAD > "${RUNNER_TEMP}/release-policy.sha"
          cargo build --locked --release --manifest-path xtask/Cargo.toml
          install -m 0700 xtask/target/release/xtask "${RUNNER_TEMP}/release-xtask"
          sha256sum "${RUNNER_TEMP}/release-xtask" > "${RUNNER_TEMP}/release-xtask.sha256"

      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.invocation.outputs.source }}

      - name: Qualify release or ordinary no-op
        id: qualify
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.invocation.outputs.mode }}
          ORIGINAL_ATTEMPT: ${{ inputs.original_run_attempt }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          SOURCE_SHA: ${{ steps.invocation.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "${RUNNER_TEMP}/release-xtask.sha256"
          test "$(cat "${RUNNER_TEMP}/release-policy.sha")" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          args=(github release qualify --mode "${MODE}" --source "${SOURCE_SHA}")
          # Recovery alone binds the original run and attempt.
          case "${MODE}" in
            recover)
              args+=(--original-run-id "${ORIGINAL_RUN_ID}")
              args+=(--original-run-attempt "${ORIGINAL_ATTEMPT}")
              ;;
            push|validate)
              ;;
            *)
              exit 1
              ;;
          esac
          "${RUNNER_TEMP}/release-xtask" "${args[@]}"

  publish:
    name: Publish source crate
    if: >-
      ${{ needs.qualify.outputs.qualified == 'true' &&
          needs.qualify.outputs.registry_state == 'absent' }}
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      # This checkout is protected current-main policy, never historical
      # recovery source. The compiled qualifier survives the source checkout.
      - name: Check out protected publication policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Rust 1.98.0
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.98.0

      - name: Compile protected typed requalifier
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git rev-parse HEAD > "${RUNNER_TEMP}/release-policy.sha"
          cargo build --locked --release --manifest-path xtask/Cargo.toml
          install -m 0700 xtask/target/release/xtask "${RUNNER_TEMP}/release-xtask"
          sha256sum "${RUNNER_TEMP}/release-xtask" > "${RUNNER_TEMP}/release-xtask.sha256"

      - name: Check out exact qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.qualify.outputs.source }}

      - name: Install exact cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        with:
          version: 1.20.1

      - name: Install pinned release-plz
        run: |
          # Install the sole Cargo publisher at the reviewed version.
          cargo binstall --force --locked --no-confirm release-plz@0.3.160

      - name: Requalify exact source after approval
        id: requalify
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.qualify.outputs.mode }}
          ORIGINAL_ATTEMPT: ${{ inputs.original_run_attempt }}
          ORIGINAL_RUN_ID: ${{ inputs.original_run_id }}
          POLICY_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source }}
        run: |
          set -euo pipefail
          sha256sum --check "${RUNNER_TEMP}/release-xtask.sha256"
          test "$(cat "${RUNNER_TEMP}/release-policy.sha")" = "${POLICY_SHA}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          # Refuse any release-plz executable other than the requested pin.
          test "$(release-plz --version)" = "release-plz 0.3.160"
          git -c credential.helper= fetch --no-tags --no-recurse-submodules \
            origin "+refs/heads/main:refs/remotes/origin/policy-main"
          test "$(git rev-parse refs/remotes/origin/policy-main)" = "${POLICY_SHA}"
          git update-ref refs/remotes/origin/main "${SOURCE_SHA}"
          git switch --force-create main "${SOURCE_SHA}"
          git branch --set-upstream-to=origin/main main
          test "$(git rev-parse main)" = "${SOURCE_SHA}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${SOURCE_SHA}"
          # Fresh pushes freeze live main; recovery rebinds only its historical
          # source and original run coordinates under current protected policy.
          case "${MODE}" in
            push)
              test "${POLICY_SHA}" = "${SOURCE_SHA}"
              "${RUNNER_TEMP}/release-xtask" github release qualify \
                --mode publish --source "${SOURCE_SHA}"
              ;;
            recover)
              git merge-base --is-ancestor "${SOURCE_SHA}" "${POLICY_SHA}"
              "${RUNNER_TEMP}/release-xtask" github release qualify \
                --mode recover --source "${SOURCE_SHA}" \
                --original-run-id "${ORIGINAL_RUN_ID}" \
                --original-run-attempt "${ORIGINAL_ATTEMPT}"
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Publish exact source with Trusted Publishing
        if: ${{ steps.requalify.outputs.registry_state == 'absent' }}
        env:
          MODE: ${{ needs.qualify.outputs.mode }}
          POLICY_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source }}
        run: |
          set -euo pipefail
          git -c credential.helper= fetch --no-tags --no-recurse-submodules \
            origin "+refs/heads/main:refs/remotes/origin/publication-main"
          test "$(git rev-parse refs/remotes/origin/publication-main)" = "${POLICY_SHA}"
          # The fresh push must still be main; recovery may use only a retained
          # ancestor of the exact protected policy that compiled the qualifier.
          case "${MODE}" in
            push)
              test "${SOURCE_SHA}" = "${POLICY_SHA}"
              ;;
            recover)
              git merge-base --is-ancestor "${SOURCE_SHA}" "${POLICY_SHA}"
              ;;
            *)
              exit 1
              ;;
          esac
          # Qualified release-plz is the sole Cargo publisher and receives the
          # read-only repository token plus this job's Trusted Publishing OIDC.
          GIT_TOKEN="${{ github.token }}" release-plz release \
            --config .release-plz.toml \
            --manifest-path Cargo.toml

  await_publication:
    name: Await exact crates.io source
    if: >-
      ${{ always() && needs.qualify.result == 'success' &&
          needs.qualify.outputs.qualified == 'true' &&
          (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    needs:
      - qualify
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out protected registry policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Rust 1.98.0
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.98.0

      - name: Compile protected registry validator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git rev-parse HEAD > "${RUNNER_TEMP}/release-policy.sha"
          cargo build --locked --release --manifest-path xtask/Cargo.toml
          install -m 0700 xtask/target/release/xtask "${RUNNER_TEMP}/release-xtask"
          sha256sum "${RUNNER_TEMP}/release-xtask" > "${RUNNER_TEMP}/release-xtask.sha256"

      - name: Check out exact qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.qualify.outputs.source }}

      - name: Rebind protected policy and source lineage
        env:
          POLICY_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source }}
        run: |
          set -euo pipefail
          git -c credential.helper= fetch --no-tags --no-recurse-submodules \
            origin "+refs/heads/main:refs/remotes/origin/policy-main"
          test "$(cat "${RUNNER_TEMP}/release-policy.sha")" = "${POLICY_SHA}"
          test "$(git rev-parse refs/remotes/origin/policy-main)" = "${POLICY_SHA}"
          git merge-base --is-ancestor "${SOURCE_SHA}" "${POLICY_SHA}"

      # This credential-free phase owns the bounded registry wait. The App
      # token is minted only in the dependent finalizer after this succeeds.
      - name: Await exact published archive
        env:
          SOURCE_SHA: ${{ needs.qualify.outputs.source }}
          VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum --check "${RUNNER_TEMP}/release-xtask.sha256"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          "${RUNNER_TEMP}/release-xtask" github release finalize \
            --phase await --source "${SOURCE_SHA}" --version "${VERSION}"

  finalize:
    name: Finalize immutable source-only Release
    if: >-
      ${{ always() && needs.qualify.result == 'success' &&
          needs.qualify.outputs.qualified == 'true' &&
          needs.await_publication.result == 'success' }}
    needs:
      - await_publication
      - qualify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The required reviewer attests the fresh repository-admin settings
    # readback after exact registry visibility and before App authorization.
    environment: protected-automation
    permissions:
      contents: read
    steps:
      - name: Check out protected finalizer policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Rust 1.98.0
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.98.0

      - name: Compile protected typed finalizer
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git rev-parse HEAD > "${RUNNER_TEMP}/release-policy.sha"
          cargo build --locked --release --manifest-path xtask/Cargo.toml
          install -m 0700 xtask/target/release/xtask "${RUNNER_TEMP}/release-xtask"
          sha256sum "${RUNNER_TEMP}/release-xtask" > "${RUNNER_TEMP}/release-xtask.sha256"

      - name: Check out exact qualified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.qualify.outputs.source }}

      # Avoid minting the App token if current protected policy or the retained
      # historical source lineage changed while registry visibility settled.
      - name: Rebind protected finalizer policy
        env:
          POLICY_SHA: ${{ github.sha }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source }}
        run: |
          set -euo pipefail
          git -c credential.helper= fetch --no-tags --no-recurse-submodules \
            origin "+refs/heads/main:refs/remotes/origin/policy-main"
          test "$(cat "${RUNNER_TEMP}/release-policy.sha")" = "${POLICY_SHA}"
          test "$(git rev-parse refs/remotes/origin/policy-main)" = "${POLICY_SHA}"
          git merge-base --is-ancestor "${SOURCE_SHA}" "${POLICY_SHA}"

      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YAML_SIGIL_RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.YAML_SIGIL_RELEASE_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Reconcile exact tag and Release
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ needs.qualify.outputs.source }}
          VERSION: ${{ needs.qualify.outputs.version }}
        run: |
          set -euo pipefail
          sha256sum --check "${RUNNER_TEMP}/release-xtask.sha256"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          "${RUNNER_TEMP}/release-xtask" github release finalize \
            --phase reconcile --source "${SOURCE_SHA}" \
            --version "${VERSION}"
