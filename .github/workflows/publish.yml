name: Publish

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate or publish an official release or tested PR snapshot.
        required: true
        default: validate
        type: choice
        options:
          - validate
          - publish
          - validate-pr
          - publish-pr
      pr_number:
        description: Pull-request number for validate-pr or publish-pr.
        required: false
        type: string

permissions: {}

env:
  # release-plz needs the named crates.io registry to resolve manifests whose
  # publish allowlist is `["crates-io"]`.
  CARGO_REGISTRIES_CRATES_IO_INDEX: https://github.com/rust-lang/crates.io-index

# Publication is resumable, so never cancel a run that might have uploaded a
# crate while a replacement waits for a publication environment.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validation:
    name: Validate release
    if: ${{ inputs.operation == 'validate' || inputs.operation == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A manual dispatch may name another ref. Keep official release authority
      # on the protected default branch whose pull requests passed Required CI.
      - name: Validate invocation
        env:
          EXPECTED_REPOSITORY: NVIDIA/yaml-sigil-traits
        run: |
          # Prevent a copied workflow from operating in another repository.
          if [[ "${GITHUB_REPOSITORY}" != "${EXPECTED_REPOSITORY}" ]]; then
            echo "This workflow runs only in ${EXPECTED_REPOSITORY}." >&2
            exit 1
          fi
          # Official tags and Releases may originate only from protected main.
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Official release operations must be dispatched from main." >&2
            exit 1
          fi

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Require a committed release version
        run: |
          cargo xtask release-version check
          git diff --exit-code

      # `autobins = false` prevents implicit executable targets. Reject an
      # explicit `[[bin]]` target too, before either release-plz invocation.
      - name: Require a library-only release package
        run: bash .github/scripts/check-release-packages.sh yaml-sigil-traits

      # Use Cargo's normal package assembly and verification instead of a
      # repository-specific archive parser.
      - name: Package with Cargo
        run: cargo package

      # This exercises release-plz package selection and publication planning
      # without requesting an OIDC token or uploading a crate.
      - name: Validate release-plz publication plan
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          command: release
          config: .release-plz.toml
          dry_run: true
          manifest_path: Cargo.toml
          version: "0.3.160"

  publication:
    name: Publish release
    if: ${{ inputs.operation == 'publish' }}
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crates-io
    permissions:
      # Create the version tag and source-only GitHub Release after publishing.
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Recheck the committed release version
        run: |
          cargo xtask release-version check
          git diff --exit-code

      # release-plz exchanges the job's OIDC identity for a short-lived
      # crates.io credential, then creates the configured version tag and
      # source-only GitHub Release. It does not build or attach binary assets.
      # Deliberately omit both a registry token and the dry_run input; any
      # nonempty dry_run value would enable dry-run mode.
      - name: Publish with Trusted Publishing
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          command: release
          config: .release-plz.toml
          manifest_path: Cargo.toml
          version: "0.3.160"

      # Read the expected version from Cargo metadata, wait for crates.io to
      # expose it as non-yanked, and confirm Cargo can resolve it.
      - name: Verify crates.io publication
        run: bash .github/scripts/verify-crates-io-packages.sh yaml-sigil-traits

      # A successful official publication asks the separate App-authenticated
      # workflow to seed the next reviewed RC proposal. Snapshot publications
      # never reach this job and therefore never trigger release proposals.
      - name: Request the next release proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cargo xtask release-version show)"
          jq --null-input --arg version "${version}" \
            '{event_type: "official-release-published", client_payload: {version: $version}}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -

  resolve_pr:
    name: Resolve tested PR
    if: ${{ inputs.operation == 'validate-pr' || inputs.operation == 'publish-pr' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.resolve.outputs.number }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # Load the PR authorization policy from trusted main, not from the PR.
      - name: Check out trusted PR authorization policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Resolve writer-authorized PR head and successful CI
        id: resolve
        env:
          EXPECTED_REPOSITORY: NVIDIA/yaml-sigil-traits
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: bash .github/scripts/resolve-tested-pull-request.sh

  validate_pr:
    name: Validate PR snapshot
    if: ${{ inputs.operation == 'validate-pr' || inputs.operation == 'publish-pr' }}
    needs: resolve_pr
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.snapshot.outputs.version }}
    steps:
      # Build the version mutator and copy the publication configuration from
      # trusted main before checking out pull-request-controlled source.
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Stage trusted release tooling
        run: |
          cargo build --locked --manifest-path xtask/Cargo.toml --bin xtask
          install -m 0755 xtask/target/debug/xtask "${RUNNER_TEMP}/yaml-sigil-xtask"
          cp .release-plz-snapshot.toml "${RUNNER_TEMP}/release-plz-snapshot.toml"
          cp .github/scripts/check-release-packages.sh \
            "${RUNNER_TEMP}/check-release-packages.sh"

      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve_pr.outputs.sha }}

      - name: Apply ephemeral snapshot version
        id: snapshot
        env:
          PR_NUMBER: ${{ needs.resolve_pr.outputs.number }}
          PR_SHA: ${{ needs.resolve_pr.outputs.sha }}
        run: |
          version="$(
            "${RUNNER_TEMP}/yaml-sigil-xtask" release-version snapshot \
              --pr "${PR_NUMBER}" --sha "${PR_SHA}"
          )"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Require a library-only snapshot package
        run: >-
          bash "${RUNNER_TEMP}/check-release-packages.sh"
          yaml-sigil-traits

      - name: Package snapshot with Cargo
        run: cargo package --allow-dirty

      - name: Validate snapshot publication plan
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          command: release
          config: ${{ runner.temp }}/release-plz-snapshot.toml
          dry_run: true
          manifest_path: Cargo.toml
          version: "0.3.160"

  publish_pr:
    name: Publish PR snapshot
    if: ${{ inputs.operation == 'publish-pr' }}
    needs:
      - resolve_pr
      - validate_pr
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: crates-io-pr
    permissions:
      actions: read
      contents: read
      pull-requests: read
      id-token: write
    steps:
      # Copy every executable release helper from trusted main before the PR
      # checkout. Only Cargo and release-plz then process PR-controlled source.
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false

      - name: Stage trusted release tooling
        run: |
          cargo build --locked --manifest-path xtask/Cargo.toml --bin xtask
          install -m 0755 xtask/target/debug/xtask "${RUNNER_TEMP}/yaml-sigil-xtask"
          cp .release-plz-snapshot.toml "${RUNNER_TEMP}/release-plz-snapshot.toml"
          cp .github/scripts/check-release-packages.sh \
            "${RUNNER_TEMP}/check-release-packages.sh"
          cp .github/scripts/recheck-tested-pull-request.sh \
            "${RUNNER_TEMP}/recheck-tested-pull-request.sh"
          cp .github/scripts/verify-crates-io-packages.sh \
            "${RUNNER_TEMP}/verify-crates-io-packages.sh"

      - name: Recheck exact PR head and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve_pr.outputs.number }}
          PR_SHA: ${{ needs.resolve_pr.outputs.sha }}
        run: bash "${RUNNER_TEMP}/recheck-tested-pull-request.sh"

      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve_pr.outputs.sha }}

      - name: Reapply exact ephemeral snapshot version
        env:
          EXPECTED_VERSION: ${{ needs.validate_pr.outputs.version }}
          PR_NUMBER: ${{ needs.resolve_pr.outputs.number }}
          PR_SHA: ${{ needs.resolve_pr.outputs.sha }}
        run: |
          version="$(
            "${RUNNER_TEMP}/yaml-sigil-xtask" release-version snapshot \
              --pr "${PR_NUMBER}" --sha "${PR_SHA}"
          )"
          # Bind publication to the version calculated during validation.
          if [[ "${version}" != "${EXPECTED_VERSION}" ]]; then
            echo "Snapshot version changed between validation and publication." >&2
            exit 1
          fi

      - name: Recheck the library-only snapshot package
        run: >-
          bash "${RUNNER_TEMP}/check-release-packages.sh"
          yaml-sigil-traits

      - name: Publish snapshot with Trusted Publishing
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          command: release
          config: ${{ runner.temp }}/release-plz-snapshot.toml
          manifest_path: Cargo.toml
          version: "0.3.160"

      - name: Verify crates.io snapshot
        run: >-
          bash "${RUNNER_TEMP}/verify-crates-io-packages.sh"
          yaml-sigil-traits
