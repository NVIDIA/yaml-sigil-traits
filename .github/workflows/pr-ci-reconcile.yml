name: Protected PR check reconciliation

on:
  workflow_run:
    workflows:
      - Protected pull request command
    types:
      - completed
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: protected-pr-check-reconciliation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  inspect_run:
    name: Inspect completed command run
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      protected: ${{ steps.inspect.outputs.protected }}
    steps:
      # Ordinary comments never enter the protected environment. This
      # checkout-free job recognizes only a strictly bound reusable call.
      - name: Load protected reconciliation policy
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ github.sha }}
        run: |
          install -d "${RUNNER_TEMP}/protected-pr-ci"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/protected_pr_ci.py?ref=${POLICY_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/protected-pr-ci/controller.py"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/protected-pr-ci.json?ref=${POLICY_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          test -s "${RUNNER_TEMP}/protected-pr-ci/controller.py"
          test -s "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          python3 -m py_compile "${RUNNER_TEMP}/protected-pr-ci/controller.py"

      - name: Inspect exact reusable-call binding
        id: inspect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ github.sha }}
        run: >-
          python3 "${RUNNER_TEMP}/protected-pr-ci/controller.py" inspect-run
          --event "${GITHUB_EVENT_PATH}"
          --config "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          --github-output "${GITHUB_OUTPUT}"
          --repository "${GITHUB_REPOSITORY}"

  reconcile_run:
    name: Close check left by completed workflow
    needs: inspect_run
    if: ${{ github.event_name == 'workflow_run' && needs.inspect_run.outputs.protected == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: protected-automation
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Create least-privilege GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YAML_SIGIL_RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.YAML_SIGIL_RELEASE_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-contents: read

      # Reconciliation reloads and reruns the current protected-main policy
      # before it updates an exact App-owned pending check.
      - name: Load protected check policy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          POLICY_SHA: ${{ github.sha }}
        run: |
          install -d "${RUNNER_TEMP}/protected-pr-ci"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/protected_pr_ci.py?ref=${POLICY_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/protected-pr-ci/controller.py"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/protected-pr-ci.json?ref=${POLICY_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          test -s "${RUNNER_TEMP}/protected-pr-ci/controller.py"
          test -s "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          python3 -m py_compile "${RUNNER_TEMP}/protected-pr-ci/controller.py"

      - name: Reconcile exact App check
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ github.sha }}
        run: >-
          python3 "${RUNNER_TEMP}/protected-pr-ci/controller.py" reconcile-run
          --event "${GITHUB_EVENT_PATH}"
          --config "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          --repository "${GITHUB_REPOSITORY}"

  sweep:
    name: Sweep orphaned checks
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: protected-automation
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Create least-privilege GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YAML_SIGIL_RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.YAML_SIGIL_RELEASE_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-contents: read

      - name: Load protected check policy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          POLICY_SHA: ${{ github.sha }}
        run: |
          install -d "${RUNNER_TEMP}/protected-pr-ci"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/protected_pr_ci.py?ref=${POLICY_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/protected-pr-ci/controller.py"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/protected-pr-ci.json?ref=${POLICY_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          test -s "${RUNNER_TEMP}/protected-pr-ci/controller.py"
          test -s "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          python3 -m py_compile "${RUNNER_TEMP}/protected-pr-ci/controller.py"

      - name: Sweep exact completed runs
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ github.sha }}
        run: >-
          python3 "${RUNNER_TEMP}/protected-pr-ci/controller.py" sweep
          --config "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          --repository "${GITHUB_REPOSITORY}"
