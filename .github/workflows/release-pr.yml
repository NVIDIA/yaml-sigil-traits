name: Release proposal

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Create the next RC or promote the exact published RC to stable.
        required: true
        default: next-candidate
        type: choice
        options:
          - next-candidate
          - promote-stable
      bump:
        description: Select the next-candidate line; stable promotion uses patch.
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

jobs:
  proposal:
    name: Run trusted proposal workflow
    permissions:
      checks: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/release-proposal.yml
    with:
      source-event: ${{ github.event_name }}
      mode: ${{ inputs.mode || 'next-candidate' }}
      bump: ${{ inputs.bump || 'patch' }}
    secrets: inherit
