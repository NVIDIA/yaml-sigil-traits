name: Release proposal

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - official-release-published
  workflow_dispatch:
    inputs:
      mode:
        description: Create the next RC or promote the exact published RC to stable.
        required: true
        default: next-candidate
        type: choice
        options:
          - next-candidate
          - promote-stable
      bump:
        description: Override an otherwise non-discoverable version-line change.
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release-proposal-${{ github.repository }}
  cancel-in-progress: true

jobs:
  app_pending:
    name: GitHub App pending
    if: ${{ vars.YAML_SIGIL_RELEASE_PR_APP_CLIENT_ID == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain deferred activation
        run: >-
          echo "Release proposal automation remains inactive until the
          organization-owned GitHub App is installed and configured."

  proposal:
    name: Prepare release proposal
    if: ${{ vars.YAML_SIGIL_RELEASE_PR_APP_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: protected-automation
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Create least-privilege GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YAML_SIGIL_RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.YAML_SIGIL_RELEASE_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: 1.95.0

      - name: Install exact cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        with:
          version: 1.20.1

      - name: Install and verify release analyzers
        run: cargo xtask release install-tools

      - name: Require the expected repository and current main
        run: |
          # Prevent a copied workflow from operating in another repository.
          if [[ "${GITHUB_REPOSITORY}" != "NVIDIA/yaml-sigil-traits" ]]; then
            echo "This workflow runs only in NVIDIA/yaml-sigil-traits." >&2
            exit 1
          fi
          # Manual proposals must use the protected default branch as source.
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release proposals must be dispatched from main." >&2
            exit 1
          fi
          # Bind the generated proposal to the event's exact main commit.
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "The checked-out main commit does not match the triggering commit." >&2
            exit 1
          fi
          # release-plz requires an attached branch with an upstream to resolve
          # repository history. Keep the event-bound commit while attaching it.
          git switch --force-create main "${GITHUB_SHA}"
          git branch --set-upstream-to=origin/main main
          # Branch attachment must preserve the exact event source commit.
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "Attaching main changed the triggering commit." >&2
            exit 1
          fi

      # Do not advance a release proposal while the version integrated on main
      # is still awaiting publication. This makes release-PR merge and package
      # publication an ordered transaction.
      - name: Require the current source version on crates.io
        id: published
        run: |
          version="$(cargo xtask release-version show)"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          # Exit 3 means the integrated version is awaiting publication. That
          # is an ordered wait state, while any other error must fail the run.
          if cargo xtask release verify-registry \
            --check-version "${version}" yaml-sigil-traits; then
            echo "available=true" >>"${GITHUB_OUTPUT}"
          else
            status="$?"
            # Registry failures are errors; only an exact 404 is a wait state.
            if [[ "${status}" -ne 3 ]]; then
              exit "${status}"
            fi
            echo "available=false" >>"${GITHUB_OUTPUT}"
            echo "${version} is not yet published; no later proposal is created."
          fi

      # The concrete reviewed intent is retained in every next-candidate PR.
      - name: Resolve release mode and bump intent
        id: intent
        if: ${{ steps.published.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          REQUESTED_BUMP: ${{ inputs.bump || 'patch' }}
          REQUESTED_MODE: ${{ inputs.mode || 'next-candidate' }}
        run: bash .github/scripts/resolve-release-intent.sh

      - name: Prepare the official tagged baseline
        id: baseline
        if: ${{ steps.published.outputs.available == 'true' }}
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: remote.origin.pushurl
          GIT_CONFIG_VALUE_0: disabled://yaml-sigil-release-proposal
        run: |
          python3 .github/scripts/prepare_release_baseline.py \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${{ steps.published.outputs.version }}" \
            --head "${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/official-release-baseline" \
            --expected-fetch-url "https://github.com/${GITHUB_REPOSITORY}"

      - name: Generate and validate release transaction
        id: generate
        if: ${{ steps.published.outputs.available == 'true' }}
        env:
          EFFECTIVE_BUMP: ${{ steps.intent.outputs.bump }}
          GIT_TOKEN: ${{ github.token }}
          MODE: ${{ steps.intent.outputs.mode }}
          PUBLISHED_VERSION: ${{ steps.published.outputs.version }}
          REGISTRY_MANIFEST_PATH: ${{ steps.baseline.outputs.manifest }}
          RELEASE_MARKER: ${{ steps.intent.outputs.marker }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: remote.origin.pushurl
          GIT_CONFIG_VALUE_0: disabled://yaml-sigil-release-proposal
        run: bash .github/scripts/generate-release-proposal.sh

      # Proposal analysis cannot authorize a later tag or main state. Recheck
      # the complete persisted authority immediately before the App writes.
      - name: Recheck official tags and current main before mutation
        if: ${{ steps.published.outputs.available == 'true' }}
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: remote.origin.pushurl
          GIT_CONFIG_VALUE_0: disabled://yaml-sigil-release-proposal
        run: |
          python3 .github/scripts/prepare_release_baseline.py \
            --repository "${GITHUB_REPOSITORY}" \
            --head "${GITHUB_SHA}" \
            --verify-inventory "${{ steps.baseline.outputs.inventory }}" \
            --expected-fetch-url "https://github.com/${GITHUB_REPOSITORY}"

      # GitHub signs Git Database commits created with the App installation
      # token. The helper derives the bot's DCO identity, rejects foreign
      # branch commits, and keeps the generated file set narrow.
      - name: Create or update release pull request
        id: release-pr
        if: ${{ steps.published.outputs.available == 'true' }}
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BODY_FILE: ${{ runner.temp }}/release-pr-body.md
          RELEASE_BRANCH: release-plz-next
          RELEASE_DRAFT: ${{ steps.generate.outputs.draft }}
          RELEASE_TITLE: ${{ steps.generate.outputs.title }}
        run: bash .github/scripts/update-release-pull-request.sh

      - name: Check out generated Verified commit
        if: ${{ steps.published.outputs.available == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release-pr.outputs.commit_sha }}

      - name: Attach generated release branch
        if: ${{ steps.published.outputs.available == 'true' }}
        env:
          RELEASE_BRANCH: release-plz-next
          RELEASE_COMMIT: ${{ steps.release-pr.outputs.commit_sha }}
        run: |
          # release-plz needs an attached branch and upstream. Bind both local
          # refs to the exact App commit already verified by the helper.
          git update-ref "refs/remotes/origin/${RELEASE_BRANCH}" "${RELEASE_COMMIT}"
          git switch --force-create "${RELEASE_BRANCH}" "${RELEASE_COMMIT}"
          git branch --set-upstream-to="origin/${RELEASE_BRANCH}" "${RELEASE_BRANCH}"
          # Branch attachment must preserve the exact generated commit twice.
          if [[ "$(git rev-parse HEAD)" != "${RELEASE_COMMIT}" \
            || "$(git rev-parse '@{upstream}')" != "${RELEASE_COMMIT}" ]]; then
            echo "Attaching the release branch changed the generated commit." >&2
            exit 1
          fi

      - name: Recheck clean generated release source
        if: ${{ steps.published.outputs.available == 'true' }}
        env:
          # Resolve manifests whose publish allowlist names crates-io.
          CARGO_REGISTRIES_CRATES_IO_INDEX: https://github.com/rust-lang/crates.io-index
          GIT_TOKEN: ${{ github.token }}
        run: |
          cargo xtask release-version check
          test -z "$(git status --porcelain --untracked-files=no)"
          cargo metadata --no-deps --format-version 1 >/dev/null
          # The read-only job token permits forge checks; dry-run cannot publish.
          release-plz release --dry-run --forge github --config .release-plz.toml
