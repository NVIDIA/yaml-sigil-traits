name: Release proposal (call only)

on:
  workflow_call:
    inputs:
      source-event:
        description: Exact trusted caller event.
        required: true
        type: string
      mode:
        description: Create the next RC or promote the published RC.
        required: true
        type: string
      bump:
        description: Requested next-candidate version line.
        required: true
        type: string

permissions: {}

# Serialize all proposal entrypoints on one repository-owned durable branch.
concurrency:
  group: release-proposal-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-notification-preflight:
    name: Authenticate release notification
    if: ${{ inputs.source-event == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      replay_key: ${{ steps.verify.outputs.replay_key }}
      replay_state: ${{ steps.verify.outputs.replay_state }}
      policy_sha: ${{ steps.verify.outputs.policy_sha }}
    steps:
      # Repository dispatch always loads this workflow from protected default
      # branch; check out only that exact policy and never notification source.
      - name: Check out exact protected release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: stable

      - name: Compile and run protected notification verifier
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_EVENT: ${{ inputs.source-event }}
        run: |
          set -euo pipefail
          test "${SOURCE_EVENT}" = "repository_dispatch"
          test "${GITHUB_EVENT_NAME}" = "repository_dispatch"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          cargo +stable build --locked --release --manifest-path xtask/Cargo.toml
          validator="${RUNNER_TEMP}/yaml-sigil-release-xtask"
          install -m 700 xtask/target/release/xtask "${validator}"
          "${validator}" github release-train receive \
            --event "${GITHUB_EVENT_PATH}" \
            --repository "${GITHUB_REPOSITORY}" \
            --policy-commit "${GITHUB_SHA}"

  trusted-event-preflight:
    name: Authorize trusted proposal event
    if: ${{ inputs.source-event != 'repository_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Bind push or manual dispatch to exact current main
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_EVENT: ${{ inputs.source-event }}
        run: |
          set -euo pipefail
          # Keep trusted push and manual authorization separate from dispatch.
          case "${SOURCE_EVENT}" in
            push|workflow_dispatch)
              test "${GITHUB_EVENT_NAME}" = "${SOURCE_EVENT}"
              ;;
            *)
              echo "Unsupported proposal caller event." >&2
              exit 1
              ;;
          esac
          test "${GITHUB_REF}" = "refs/heads/main"
          main_sha="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --jq 'select(.ref == "refs/heads/main" and .object.type == "commit") | .object.sha')"
          test "${main_sha}" = "${GITHUB_SHA}"

  app-pending:
    name: GitHub App pending
    needs:
      - release-notification-preflight
      - trusted-event-preflight
    if: >-
      ${{ always() && vars.YAML_SIGIL_RELEASE_PR_APP_CLIENT_ID == '' &&
          ((inputs.source-event == 'repository_dispatch' &&
            needs.release-notification-preflight.result == 'success') ||
           (inputs.source-event != 'repository_dispatch' &&
            needs.trusted-event-preflight.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain deferred activation
        run: >-
          echo "Release proposal automation remains inactive until the
          repository-scoped GitHub App is configured."

  proposal:
    name: Prepare release proposal
    needs:
      - release-notification-preflight
      - trusted-event-preflight
    if: >-
      ${{ always() && vars.YAML_SIGIL_RELEASE_PR_APP_CLIENT_ID != '' &&
          ((inputs.source-event == 'repository_dispatch' &&
            needs.release-notification-preflight.result == 'success') ||
           (inputs.source-event != 'repository_dispatch' &&
            needs.trusted-event-preflight.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: protected-automation
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out exact authorized main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: stable

      - name: Bind repository and workflow identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo +stable xtask github git-identity configure

      - name: Install exact cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1
        with:
          version: 1.20.1

      - name: Install and verify release analyzers
        run: cargo +stable xtask release install-tools

      - name: Require current main
        run: |
          # Every proposal source is the exact protected default branch.
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release proposals must originate from main." >&2
            exit 1
          fi
          # Bind the generated proposal to the event's exact main commit.
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "The checked-out main commit differs from the authorized event." >&2
            exit 1
          fi
          git switch --force-create main "${GITHUB_SHA}"
          git branch --set-upstream-to=origin/main main
          # Branch attachment must preserve the exact event source commit.
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "Attaching main changed the authorized commit." >&2
            exit 1
          fi

      - name: Require the current source version on crates.io
        id: published
        run: |
          version="$(cargo +stable xtask release-version show)"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          # Exact absence is an ordered wait state; other failures stop.
          if cargo +stable xtask release verify-registry \
            --check-version "${version}" yaml-sigil-traits; then
            echo "available=true" >>"${GITHUB_OUTPUT}"
          else
            status="$?"
            # Only the command's exact absence status may suppress a proposal.
            if [[ "${status}" -ne 3 ]]; then
              exit "${status}"
            fi
            echo "available=false" >>"${GITHUB_OUTPUT}"
            echo "${version} is not yet published; no later proposal is created."
          fi

      - name: Resolve release mode and bump intent
        id: intent
        if: ${{ steps.published.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_DISPATCH: ${{ inputs.source-event == 'workflow_dispatch' }}
          REQUESTED_BUMP: ${{ inputs.bump }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: cargo +stable xtask github release-pr resolve-intent

      - name: Prepare the official tagged baseline
        id: baseline
        if: >-
          ${{ steps.published.outputs.available == 'true' &&
              steps.intent.outputs.proceed == 'true' }}
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: remote.origin.pushurl
          GIT_CONFIG_VALUE_0: disabled://yaml-sigil-release-proposal
        run: |
          result="${RUNNER_TEMP}/baseline-result.json"
          cargo +stable xtask release baseline prepare \
            --version "${{ steps.published.outputs.version }}" \
            --head "${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/official-release-baseline" \
            --result "${result}" \
            --expected-fetch-url "https://github.com/${GITHUB_REPOSITORY}"
          jq --raw-output \
            '"commit=\(.commit)",
             "manifest=\(.manifest)",
             "version=\(.version)",
             "inventory=\(.inventory)",
             "tags=\(.tags | @json)"' \
            "${result}" >>"${GITHUB_OUTPUT}"

      - name: Generate and validate release transaction
        id: generate
        if: >-
          ${{ steps.published.outputs.available == 'true' &&
              steps.intent.outputs.proceed == 'true' }}
        env:
          GIT_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: remote.origin.pushurl
          GIT_CONFIG_VALUE_0: disabled://yaml-sigil-release-proposal
        run: |
          result="${RUNNER_TEMP}/proposal-result.json"
          cargo +stable xtask release proposal generate \
            --mode "${{ steps.intent.outputs.mode }}" \
            --bump "${{ steps.intent.outputs.bump }}" \
            --published-version "${{ steps.published.outputs.version }}" \
            --registry-manifest "${{ steps.baseline.outputs.manifest }}" \
            --date "$(date -u +%F)" \
            --result "${result}"
          jq --raw-output \
            '"target=\(.target)", "substantive=\(.substantive)"' \
            "${result}" >>"${GITHUB_OUTPUT}"

      - name: Recheck official tags and current main before token minting
        if: >-
          ${{ steps.published.outputs.available == 'true' &&
              steps.intent.outputs.proceed == 'true' }}
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: remote.origin.pushurl
          GIT_CONFIG_VALUE_0: disabled://yaml-sigil-release-proposal
        run: |
          cargo +stable xtask release baseline verify \
            --head "${GITHUB_SHA}" \
            --inventory "${{ steps.baseline.outputs.inventory }}" \
            --expected-fetch-url "https://github.com/${GITHUB_REPOSITORY}"
          cargo +stable xtask release require-current-main \
            --head "${GITHUB_SHA}" \
            --fetch-url "https://github.com/${GITHUB_REPOSITORY}"

      - name: Create repository-scoped proposal token
        id: app-token
        if: >-
          ${{ steps.published.outputs.available == 'true' &&
              steps.intent.outputs.proceed == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YAML_SIGIL_RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.YAML_SIGIL_RELEASE_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update release pull request
        id: release-pr
        if: >-
          ${{ steps.published.outputs.available == 'true' &&
              steps.intent.outputs.proceed == 'true' }}
        env:
          APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BRANCH: release-plz-next
          RELEASE_HOLD_DRAFT: "true"
          RELEASE_REPLAY_KEY: ${{ needs.release-notification-preflight.outputs.replay_key }}
          RELEASE_SUBSTANTIVE: ${{ steps.generate.outputs.substantive }}
          RELEASE_TARGET: ${{ steps.generate.outputs.target }}
        run: cargo +stable xtask github release-pr apply --phase update

      - name: Check out generated Verified commit
        if: >-
          ${{ steps.published.outputs.available == 'true' &&
              steps.intent.outputs.proceed == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release-pr.outputs.commit_sha }}

      - name: Attach generated release branch
        if: >-
          ${{ steps.published.outputs.available == 'true' &&
              steps.intent.outputs.proceed == 'true' }}
        env:
          RELEASE_BRANCH: release-plz-next
          RELEASE_COMMIT: ${{ steps.release-pr.outputs.commit_sha }}
        run: |
          git update-ref "refs/remotes/origin/${RELEASE_BRANCH}" "${RELEASE_COMMIT}"
          git switch --force-create "${RELEASE_BRANCH}" "${RELEASE_COMMIT}"
          git branch --set-upstream-to="origin/${RELEASE_BRANCH}" "${RELEASE_BRANCH}"
          # Branch attachment must preserve the exact generated commit twice.
          if [[ "$(git rev-parse HEAD)" != "${RELEASE_COMMIT}" \
            || "$(git rev-parse '@{upstream}')" != "${RELEASE_COMMIT}" ]]; then
            echo "Attaching the release branch changed the generated commit." >&2
            exit 1
          fi

      - name: Recheck clean generated release source
        if: >-
          ${{ steps.published.outputs.available == 'true' &&
              steps.intent.outputs.proceed == 'true' }}
        env:
          CARGO_REGISTRIES_CRATES_IO_INDEX: https://github.com/rust-lang/crates.io-index
          GIT_TOKEN: ${{ github.token }}
        run: |
          cargo +stable xtask release-version check
          test -z "$(git status --porcelain --untracked-files=no)"
          cargo +stable metadata --no-deps --format-version 1 >/dev/null
          # Read-only dry-run validates package selection without publication.
          release-plz release \
            --dry-run \
            --forge github \
            --config .release-plz.toml \
            --manifest-path Cargo.toml
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Finalize validated release pull request
        if: >-
          ${{ steps.published.outputs.available == 'true' &&
              steps.intent.outputs.proceed == 'true' }}
        env:
          APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BRANCH: release-plz-next
          RELEASE_COMMIT: ${{ steps.release-pr.outputs.commit_sha }}
          RELEASE_HOLD_DRAFT: "true"
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.pr_number }}
          RELEASE_REPLAY_KEY: ${{ steps.release-pr.outputs.release_replay_key }}
          RELEASE_SUBSTANTIVE: ${{ steps.generate.outputs.substantive }}
          RELEASE_TARGET: ${{ steps.generate.outputs.target }}
        run: cargo +stable xtask github release-pr apply --phase finalize
