name: Protected pull request CI
run-name: PR #${{ inputs.pull_number }} /ok to test ${{ inputs.head_sha }}

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number.
        required: true
        type: string
      head_sha:
        description: Exact authorized pull request head.
        required: true
        type: string
      base_sha:
        description: Exact protected-main base.
        required: true
        type: string
      policy_sha:
        description: Exact protected-main policy commit.
        required: true
        type: string
      comment_id:
        description: Exact authorization comment.
        required: true
        type: string

permissions: {}

concurrency:
  group: protected-pr-ci-${{ github.repository }}-${{ inputs.pull_number }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact pull request head
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      repository: ${{ steps.authorize.outputs.repository }}
      pull_number: ${{ steps.authorize.outputs.pull_number }}
      head_sha: ${{ steps.authorize.outputs.head_sha }}
      base_sha: ${{ steps.authorize.outputs.base_sha }}
      head_repository: ${{ steps.authorize.outputs.head_repository }}
      policy_sha: ${{ steps.authorize.outputs.policy_sha }}
      comment_id: ${{ steps.authorize.outputs.comment_id }}
    steps:
      # Authorization code and its inventory come only from the immutable
      # protected-main commit that supplied this workflow run.
      - name: Check out protected policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: policy
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Reauthorize dispatched command and candidate
        id: authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ github.sha }}
        run: >-
          python3 policy/.github/scripts/protected_pr_ci.py authorize-dispatch
          --event "${GITHUB_EVENT_PATH}"
          --config policy/.github/protected-pr-ci.json
          --github-output "${GITHUB_OUTPUT}"

  start_check:
    name: Start protected Required CI check
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: protected-automation
    permissions:
      contents: read
    outputs:
      check_id: ${{ steps.start.outputs.check_id }}
      external_id: ${{ steps.start.outputs.external_id }}
    steps:
      - name: Create least-privilege GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YAML_SIGIL_RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.YAML_SIGIL_RELEASE_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-contents: read

      # Fetching exact files through the API keeps this privileged check job
      # checkout-free and prevents any candidate path from entering the job.
      - name: Load immutable check policy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          POLICY_SHA: ${{ needs.authorize.outputs.policy_sha }}
        run: |
          install -d "${RUNNER_TEMP}/protected-pr-ci"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/protected_pr_ci.py?ref=${POLICY_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/protected-pr-ci/controller.py"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/protected-pr-ci.json?ref=${POLICY_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          test -s "${RUNNER_TEMP}/protected-pr-ci/controller.py"
          test -s "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          python3 -m py_compile "${RUNNER_TEMP}/protected-pr-ci/controller.py"

      - name: Create App-owned in-progress check
        id: start
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          python3 "${RUNNER_TEMP}/protected-pr-ci/controller.py" start-check
          --config "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          --github-output "${GITHUB_OUTPUT}"
          --repository "${{ needs.authorize.outputs.repository }}"
          --pull-number "${{ needs.authorize.outputs.pull_number }}"
          --head-sha "${{ needs.authorize.outputs.head_sha }}"
          --base-sha "${{ needs.authorize.outputs.base_sha }}"
          --policy-sha "${{ needs.authorize.outputs.policy_sha }}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"

  commit_policy:
    name: Commit policy
    needs:
      - authorize
      - start_check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out protected policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: policy
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.policy_sha }}

      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.head_sha }}
          repository: ${{ needs.authorize.outputs.head_repository }}

      # The fork checkout may not contain the base object. Fetch only the exact
      # public base SHA before running the byte-identical protected helper.
      - name: Load exact base commit
        env:
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
        run: >-
          git -C candidate fetch --no-tags --no-recurse-submodules --depth=1
          "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "${BASE_SHA}"

      - name: Check pull request commits
        env:
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: ../policy/.github/scripts/check-pull-request-commits.sh
        working-directory: candidate

  workflow_lint:
    name: GitHub Actions
    needs:
      - authorize
      - start_check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out protected policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: policy
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.policy_sha }}

      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: candidate
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.head_sha }}
          repository: ${{ needs.authorize.outputs.head_repository }}

      # actionlint discovers configuration and workflows at the workspace root.
      # Stage candidate YAML as inert input beside protected-main configuration.
      - name: Stage workflows for linting
        run: |
          # The staged root is deliberately checkout-free. Initialize only Git
          # metadata so actionlint recognizes it as a project workspace.
          git init --quiet --initial-branch=main .
          install -d .github/workflows
          install -m 0644 policy/.github/actionlint.yaml .github/actionlint.yaml
          find candidate/.github/workflows -maxdepth 1 -type f \
            \( -name '*.yml' -o -name '*.yaml' \) \
            -exec install -m 0644 '{}' .github/workflows/ \;
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -gt 0

      - name: Lint GitHub Actions workflows
        uses: devops-actions/actionlint@9fb9c192862f19e684586ca84b500461bcd8a541 # v0.1.12 (actionlint v1.7.12)

      # This section would benefit by a change to the action allowlist
      - name: Lint candidate shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          check_together: true
          scandir: candidate/.github/scripts
          version: v0.11.0

      - name: Compile and test protected controller
        run: |
          python3 -m py_compile \
            policy/.github/scripts/protected_pr_ci.py \
            policy/.github/scripts/test_protected_pr_ci.py
          python3 -m unittest discover \
            -s policy/.github/scripts -p 'test_protected_pr_ci.py'

      # Candidate controller tests are unprivileged and exercise the proposed
      # policy without using it to authorize or report this run.
      - name: Compile and test candidate controller
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          python3 -m py_compile \
            candidate/.github/scripts/protected_pr_ci.py \
            candidate/.github/scripts/test_protected_pr_ci.py
          python3 -m unittest discover \
            -s candidate/.github/scripts -p 'test_protected_pr_ci.py'

  static_checks:
    name: Documentation
    needs:
      - authorize
      - start_check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out protected policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: policy
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.policy_sha }}

      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: candidate
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.head_sha }}
          repository: ${{ needs.authorize.outputs.head_repository }}

      # Resolve the candidate's exact gitlink with protected-main logic, then
      # fetch it only from the fixed public specification repository.
      - name: Resolve exact specification checkout
        id: source_spec
        run: >-
          policy/.github/scripts/resolve-source-spec-gitlink.sh
          candidate "${GITHUB_OUTPUT}"

      - name: Check out exact specification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: candidate/source-spec
          persist-credentials: false
          ref: ${{ steps.source_spec.outputs.sha }}
          repository: NVIDIA/yaml-sigil-spec

      - name: Lint Markdown with protected configuration
        # Refresh this immutable pin frequently to keep pace with rumdl releases.
        uses: rvben/rumdl@95a982d941d00cf41a0dcef4d0788bd15a29be1b # v0.2.54
        with:
          config: policy/.rumdl.toml
          path: candidate
          version: "0.2.54"

  rust:
    name: Rust (${{ matrix.name }})
    needs:
      - authorize
      - start_check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_HOME: ${{ github.workspace }}/.protected-ci/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/.protected-ci/cargo-target
      RUSTFLAGS: -D warnings
      RUSTUP_HOME: ${{ github.workspace }}/.protected-ci/rustup-home
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    steps:
      - name: Check out protected policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: policy
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.policy_sha }}

      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: candidate
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.head_sha }}
          repository: ${{ needs.authorize.outputs.head_repository }}

      # Resolve the candidate's exact gitlink with protected-main logic, then
      # fetch it only from the fixed public specification repository.
      - name: Resolve exact specification checkout
        id: source_spec
        shell: bash
        run: >-
          policy/.github/scripts/resolve-source-spec-gitlink.sh
          candidate "${GITHUB_OUTPUT}"

      - name: Check out exact specification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: candidate/source-spec
          persist-credentials: false
          ref: ${{ steps.source_spec.outputs.sha }}
          repository: NVIDIA/yaml-sigil-spec

      - name: Remove unused preinstalled Homebrew source
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: policy/.github/scripts/remove-preinstalled-aws-tap.sh

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          components: clippy, rustfmt

      - name: Install protected Markdown validator
        # Refresh this immutable pin frequently to keep pace with rumdl releases.
        uses: rvben/rumdl@95a982d941d00cf41a0dcef4d0788bd15a29be1b # v0.2.54
        with:
          install-only: true
          version: "0.2.54"

      # This section would benefit by a change to the action allowlist
      - name: Install Rust validation tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          checksum: true
          fallback: none
          tool: cargo-audit,cargo-deny@0.20.2,cargo-machete@0.9.2

      # Every OS builds the validator from protected main and runs the same
      # provider-neutral checks against the candidate, including candidate
      # xtask compilation and tests. No candidate-controlled cache is saved.
      - name: Run protected validation against candidate
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        shell: bash
        run: >-
          cargo run --locked --manifest-path policy/xtask/Cargo.toml --
          ci --candidate-root "${GITHUB_WORKSPACE}/candidate"

  finish_check:
    name: Finalize protected Required CI check
    if: ${{ always() && needs.start_check.result == 'success' }}
    needs:
      - authorize
      - start_check
      - commit_policy
      - workflow_lint
      - static_checks
      - rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: protected-automation
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Create least-privilege GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YAML_SIGIL_RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.YAML_SIGIL_RELEASE_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write
          permission-contents: read

      # The final check job reads only the exact policy commit and event data;
      # it never checks out, executes, or decompresses candidate content.
      - name: Load immutable check policy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          POLICY_SHA: ${{ needs.authorize.outputs.policy_sha }}
        run: |
          install -d "${RUNNER_TEMP}/protected-pr-ci"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/protected_pr_ci.py?ref=${POLICY_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/protected-pr-ci/controller.py"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/protected-pr-ci.json?ref=${POLICY_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          test -s "${RUNNER_TEMP}/protected-pr-ci/controller.py"
          test -s "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          python3 -m py_compile "${RUNNER_TEMP}/protected-pr-ci/controller.py"

      - name: Revalidate state and finalize App check
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ needs.authorize.outputs.policy_sha }}
        run: >-
          python3 "${RUNNER_TEMP}/protected-pr-ci/controller.py" finish-check
          --event "${GITHUB_EVENT_PATH}"
          --config "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          --check-id "${{ needs.start_check.outputs.check_id }}"
          --repository "${{ needs.authorize.outputs.repository }}"
          --pull-number "${{ needs.authorize.outputs.pull_number }}"
          --head-sha "${{ needs.authorize.outputs.head_sha }}"
          --base-sha "${{ needs.authorize.outputs.base_sha }}"
          --policy-sha "${{ needs.authorize.outputs.policy_sha }}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"
          --result "commit_policy=${{ needs.commit_policy.result }}"
          --result "workflow_lint=${{ needs.workflow_lint.result }}"
          --result "static_checks=${{ needs.static_checks.result }}"
          --result "rust=${{ needs.rust.result }}"
