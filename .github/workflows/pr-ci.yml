name: Protected pull request CI

on:
  workflow_call:
    inputs:
      pull_number:
        description: Pull request number.
        required: true
        type: string
      head_sha:
        description: Exact authorized pull request head.
        required: true
        type: string
      base_sha:
        description: Exact protected-main base.
        required: true
        type: string
      policy_sha:
        description: Exact protected-main policy commit.
        required: true
        type: string
      comment_id:
        description: Exact authorization comment.
        required: true
        type: string
      binding_digest:
        description: Exact full authorization binding digest.
        required: true
        type: string
    outputs:
      results_json:
        description: Canonical complete protected-job result inventory.
        value: ${{ jobs.results.outputs.results_json }}

permissions: {}

concurrency:
  group: protected-pr-ci-${{ github.repository }}-${{ inputs.pull_number }}
  cancel-in-progress: false

jobs:
  authorize:
    name: "protected-ci|pr=${{ inputs.pull_number }}|head=${{ inputs.head_sha }}|comment=${{ inputs.comment_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      repository: ${{ steps.authorize.outputs.repository }}
      pull_number: ${{ steps.authorize.outputs.pull_number }}
      head_sha: ${{ steps.authorize.outputs.head_sha }}
      base_sha: ${{ steps.authorize.outputs.base_sha }}
      head_repository: ${{ steps.authorize.outputs.head_repository }}
      policy_sha: ${{ steps.authorize.outputs.policy_sha }}
      comment_id: ${{ steps.authorize.outputs.comment_id }}
      candidate_ci_required: ${{ steps.authorize.outputs.candidate_ci_required }}
    steps:
      # Authorization remains checkout-free and reloads the immutable policy
      # selected by the protected issue-comment caller.
      - name: Load protected authorization policy
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ github.sha }}
        run: |
          install -d "${RUNNER_TEMP}/protected-pr-ci"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/protected_pr_ci.py?ref=${POLICY_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/protected-pr-ci/controller.py"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/protected-pr-ci.json?ref=${POLICY_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          test -s "${RUNNER_TEMP}/protected-pr-ci/controller.py"
          test -s "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          python3 -m py_compile "${RUNNER_TEMP}/protected-pr-ci/controller.py"

      - name: Reauthorize called command and candidate
        id: authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ github.sha }}
        run: >-
          python3 "${RUNNER_TEMP}/protected-pr-ci/controller.py" authorize-call
          --event "${GITHUB_EVENT_PATH}"
          --config "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          --github-output "${GITHUB_OUTPUT}"
          --repository "${GITHUB_REPOSITORY}"
          --pull-number "${{ inputs.pull_number }}"
          --head-sha "${{ inputs.head_sha }}"
          --base-sha "${{ inputs.base_sha }}"
          --policy-sha "${{ inputs.policy_sha }}"
          --binding-digest "${{ inputs.binding_digest }}"
          --comment-id "${{ inputs.comment_id }}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"

  commit_policy:
    name: Commit policy
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out protected policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: policy
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.policy_sha }}

      - name: Check out and verify exact candidate
        uses: ./policy/.github/actions/protected-candidate-checkout
        with:
          base-sha: ${{ needs.authorize.outputs.base_sha }}
          candidate-path: candidate
          fetch-depth: 0
          head-sha: ${{ needs.authorize.outputs.head_sha }}
          policy-path: policy
          repository: ${{ needs.authorize.outputs.head_repository }}

      # The fork checkout may not contain the base object. Fetch only the exact
      # public base SHA before running the byte-identical protected helper.
      - name: Load exact base commit
        env:
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
        run: >-
          git -C candidate fetch --no-tags --no-recurse-submodules --depth=1
          "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "${BASE_SHA}"

      - name: Check pull request commits
        env:
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: ../policy/.github/scripts/check-pull-request-commits.sh
        working-directory: candidate

  workflow_lint:
    name: GitHub Actions
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out protected policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: policy
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.policy_sha }}

      - name: Check out and verify exact candidate
        uses: ./policy/.github/actions/protected-candidate-checkout
        with:
          base-sha: ${{ needs.authorize.outputs.base_sha }}
          candidate-path: candidate
          fetch-depth: 1
          head-sha: ${{ needs.authorize.outputs.head_sha }}
          policy-path: policy
          repository: ${{ needs.authorize.outputs.head_repository }}

      # actionlint discovers configuration and workflows at the workspace root.
      # Stage candidate YAML as inert input beside protected-main configuration.
      - name: Stage workflows for linting
        run: |
          # The staged root is deliberately checkout-free. Initialize only Git
          # metadata so actionlint recognizes it as a project workspace.
          git init --quiet --initial-branch=main .
          install -d .github/workflows
          install -m 0644 policy/.github/actionlint.yaml .github/actionlint.yaml
          find candidate/.github/workflows -maxdepth 1 -type f \
            \( -name '*.yml' -o -name '*.yaml' \) \
            -exec install -m 0644 '{}' .github/workflows/ \;
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -gt 0

      - name: Lint GitHub Actions workflows
        uses: devops-actions/actionlint@9fb9c192862f19e684586ca84b500461bcd8a541 # v0.1.12 (actionlint v1.7.12)

      # This section would benefit by a change to the action allowlist
      - name: Lint candidate shell scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          check_together: true
          scandir: candidate/.github/scripts
          version: v0.11.0

      - name: Compile and test protected controller
        run: |
          python3 -m py_compile \
            policy/.github/scripts/protected_pr_ci.py \
            policy/.github/scripts/test_protected_pr_ci.py
          python3 -m unittest discover \
            -s policy/.github/scripts -p 'test_protected_pr_ci.py'

      # Candidate controller tests are unprivileged and exercise the proposed
      # policy without using it to authorize or report this run.
      - name: Compile and test candidate controller
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          python3 -m py_compile \
            candidate/.github/scripts/protected_pr_ci.py \
            candidate/.github/scripts/test_protected_pr_ci.py
          python3 -m unittest discover \
            -s candidate/.github/scripts -p 'test_protected_pr_ci.py'

  platform_verifier:
    name: Protected checkout verifier (${{ matrix.name }})
    needs: authorize
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    steps:
      - name: Check out protected policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: policy
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.policy_sha }}

      - name: Check out and verify exact candidate
        id: candidate_checkout
        uses: ./policy/.github/actions/protected-candidate-checkout
        with:
          base-sha: ${{ needs.authorize.outputs.base_sha }}
          candidate-path: candidate
          fetch-depth: 1
          head-sha: ${{ needs.authorize.outputs.head_sha }}
          policy-path: policy
          repository: ${{ needs.authorize.outputs.head_repository }}

      # Candidate tests are unprivileged; the interpreter was resolved and
      # staged by protected policy before candidate files existed.
      - name: Test candidate checkout verifier on host platform
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          TRUSTED_PYTHON: ${{ steps.candidate_checkout.outputs.python }}
        shell: bash
        run: |
          "${TRUSTED_PYTHON}" -m py_compile \
            candidate/.github/scripts/protected_checkout.py \
            candidate/.github/scripts/protected_pr_ci.py \
            candidate/.github/scripts/test_protected_pr_ci.py
          "${TRUSTED_PYTHON}" -m unittest discover \
            -s candidate/.github/scripts -p 'test_protected_pr_ci.py'

  static_checks:
    name: Documentation
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out protected policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: policy
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.policy_sha }}

      - name: Check out and verify exact candidate
        uses: ./policy/.github/actions/protected-candidate-checkout
        with:
          base-sha: ${{ needs.authorize.outputs.base_sha }}
          candidate-path: candidate
          fetch-depth: 1
          head-sha: ${{ needs.authorize.outputs.head_sha }}
          policy-path: policy
          repository: ${{ needs.authorize.outputs.head_repository }}

      # Resolve the candidate's exact gitlink with protected-main logic, then
      # fetch it only from the fixed public specification repository.
      - name: Resolve exact specification checkout
        id: source_spec
        run: >-
          policy/.github/scripts/resolve-source-spec-gitlink.sh
          candidate "${GITHUB_OUTPUT}"

      - name: Check out exact specification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: candidate/source-spec
          persist-credentials: false
          ref: ${{ steps.source_spec.outputs.sha }}
          repository: NVIDIA/yaml-sigil-spec

      - name: Lint Markdown with protected configuration
        # Refresh this immutable pin frequently to keep pace with rumdl releases.
        uses: rvben/rumdl@95a982d941d00cf41a0dcef4d0788bd15a29be1b # v0.2.54
        with:
          config: policy/.rumdl.toml
          path: candidate
          version: "0.2.54"

  rust:
    name: Rust (${{ matrix.name }})
    needs: authorize
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_HOME: ${{ github.workspace }}/.protected-ci/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/.protected-ci/cargo-target
      RUSTFLAGS: -D warnings
      RUSTUP_HOME: ${{ github.workspace }}/.protected-ci/rustup-home
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    steps:
      - name: Check out protected policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: policy
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.policy_sha }}

      - name: Check out and verify exact candidate
        uses: ./policy/.github/actions/protected-candidate-checkout
        with:
          base-sha: ${{ needs.authorize.outputs.base_sha }}
          candidate-path: candidate
          fetch-depth: 1
          head-sha: ${{ needs.authorize.outputs.head_sha }}
          policy-path: policy
          repository: ${{ needs.authorize.outputs.head_repository }}

      # Resolve the candidate's exact gitlink with protected-main logic, then
      # fetch it only from the fixed public specification repository.
      - name: Resolve exact specification checkout
        id: source_spec
        shell: bash
        run: >-
          policy/.github/scripts/resolve-source-spec-gitlink.sh
          candidate "${GITHUB_OUTPUT}"

      - name: Check out exact specification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: candidate/source-spec
          persist-credentials: false
          ref: ${{ steps.source_spec.outputs.sha }}
          repository: NVIDIA/yaml-sigil-spec

      - name: Remove unused preinstalled Homebrew source
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: policy/.github/scripts/remove-preinstalled-aws-tap.sh

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          components: clippy, rustfmt

      - name: Install protected Markdown validator
        # Refresh this immutable pin frequently to keep pace with rumdl releases.
        uses: rvben/rumdl@95a982d941d00cf41a0dcef4d0788bd15a29be1b # v0.2.54
        with:
          install-only: true
          version: "0.2.54"

      # This section would benefit by a change to the action allowlist
      - name: Install Rust validation tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          checksum: true
          fallback: none
          tool: cargo-audit,cargo-deny@0.20.2,cargo-machete@0.9.2

      # Every OS builds the validator from protected main and runs the same
      # provider-neutral checks against the candidate, including candidate
      # xtask compilation and tests. No candidate-controlled cache is saved.
      - name: Run protected validation against candidate
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        shell: bash
        run: >-
          cargo run --locked --manifest-path policy/xtask/Cargo.toml --
          ci --candidate-root "${GITHUB_WORKSPACE}/candidate"

  candidate_ci:
    name: Candidate cargo xtask CI (${{ matrix.name }})
    if: ${{ needs.authorize.outputs.candidate_ci_required == 'true' }}
    needs: authorize
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_HOME: ${{ github.workspace }}/.candidate-ci/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/.candidate-ci/cargo-target
      RUSTFLAGS: -D warnings
      RUSTUP_HOME: ${{ github.workspace }}/.candidate-ci/rustup-home
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    steps:
      - name: Check out protected policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: policy
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.policy_sha }}

      - name: Check out and verify exact candidate
        uses: ./policy/.github/actions/protected-candidate-checkout
        with:
          base-sha: ${{ needs.authorize.outputs.base_sha }}
          candidate-path: candidate
          fetch-depth: 1
          head-sha: ${{ needs.authorize.outputs.head_sha }}
          policy-path: policy
          repository: ${{ needs.authorize.outputs.head_repository }}

      # Resolve the candidate's exact gitlink with protected-main logic, then
      # fetch it only from the fixed public specification repository.
      - name: Resolve exact specification checkout
        id: source_spec
        shell: bash
        run: >-
          policy/.github/scripts/resolve-source-spec-gitlink.sh
          candidate "${GITHUB_OUTPUT}"

      - name: Check out exact specification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: candidate/source-spec
          persist-credentials: false
          ref: ${{ steps.source_spec.outputs.sha }}
          repository: NVIDIA/yaml-sigil-spec

      - name: Remove unused preinstalled Homebrew source
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: policy/.github/scripts/remove-preinstalled-aws-tap.sh

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          components: clippy, rustfmt
          toolchain: 1.95.0,stable

      - name: Install protected Markdown validator
        # Refresh this immutable pin frequently to keep pace with rumdl releases.
        uses: rvben/rumdl@95a982d941d00cf41a0dcef4d0788bd15a29be1b # v0.2.54
        with:
          install-only: true
          version: "0.2.54"

      # This section would benefit by a change to the action allowlist
      - name: Install protected Rust validation tools
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          checksum: true
          fallback: none
          tool: cargo-audit,cargo-deny@0.20.2,cargo-machete@0.9.2

      # Only this supplemental, GitHub-hosted job executes the exact candidate
      # validator. It has no secrets, OIDC, write permission, cache, or retained
      # artifacts; the protected-main validator remains the required authority.
      - name: Verify exact Cargo 1.95 archive metadata
        env:
          YAML_SIGIL_REQUIRE_CARGO_1_95_ARCHIVE: "1"
        shell: bash
        run: >-
          cargo +1.95.0 test --locked --manifest-path xtask/Cargo.toml
          crate_archive::tests::cargo_1_95_archive_matches_observed_cross_platform_contract
          -- --exact
        working-directory: candidate

      - name: Run exact candidate validation
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        shell: bash
        run: cargo xtask ci
        working-directory: candidate

  results:
    name: Collect protected job results
    if: ${{ always() }}
    needs:
      - authorize
      - commit_policy
      - workflow_lint
      - platform_verifier
      - static_checks
      - rust
      - candidate_ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      results_json: ${{ steps.results.outputs.results_json }}
    steps:
      # Only fixed job-result enums enter this closed, complete JSON inventory.
      - name: Expose exact candidate results to the protected caller
        id: results
        env:
          CANDIDATE_CI_RESULT: ${{ needs.candidate_ci.result }}
          COMMIT_POLICY_RESULT: ${{ needs.commit_policy.result }}
          PLATFORM_VERIFIER_RESULT: ${{ needs.platform_verifier.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          STATIC_CHECKS_RESULT: ${{ needs.static_checks.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow_lint.result }}
        run: >-
          printf 'results_json={"commit_policy":"%s","workflow_lint":"%s","platform_verifier":"%s","static_checks":"%s","rust":"%s","candidate_ci":"%s"}\n'
          "${COMMIT_POLICY_RESULT}" "${WORKFLOW_LINT_RESULT}"
          "${PLATFORM_VERIFIER_RESULT}" "${STATIC_CHECKS_RESULT}"
          "${RUST_RESULT}" "${CANDIDATE_CI_RESULT}"
          >> "${GITHUB_OUTPUT}"
