name: Protected pull request command
run-name: "PR #${{ github.event.issue.number }} comment ${{ github.event.comment.id }}"

on:
  issue_comment:
    types:
      - created

permissions: {}

jobs:
  authorize:
    name: Inspect test command
    if: ${{ github.event.action == 'created' && github.event.issue.pull_request != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      pull_number: ${{ steps.authorize.outputs.pull_number }}
      head_sha: ${{ steps.authorize.outputs.head_sha }}
      base_sha: ${{ steps.authorize.outputs.base_sha }}
      policy_sha: ${{ steps.authorize.outputs.policy_sha }}
      comment_id: ${{ steps.authorize.outputs.comment_id }}
      binding_digest: ${{ steps.authorize.outputs.binding_digest }}
    steps:
      # The receiver remains checkout-free. It downloads only the immutable
      # protected-main controller and configuration selected by this event.
      - name: Load protected command policy
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ github.sha }}
        run: |
          install -d "${RUNNER_TEMP}/protected-pr-ci"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/protected_pr_ci.py?ref=${POLICY_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/protected-pr-ci/controller.py"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/protected-pr-ci.json?ref=${POLICY_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          test -s "${RUNNER_TEMP}/protected-pr-ci/controller.py"
          test -s "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          python3 -m py_compile "${RUNNER_TEMP}/protected-pr-ci/controller.py"

      - name: Authorize exact command
        id: authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ github.sha }}
        run: >-
          python3 "${RUNNER_TEMP}/protected-pr-ci/controller.py" authorize-comment
          --event "${GITHUB_EVENT_PATH}"
          --config "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          --github-output "${GITHUB_OUTPUT}"

  start_check:
    name: Start protected Required CI check
    needs: authorize
    if: ${{ needs.authorize.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: protected-automation
    permissions:
      contents: read
    outputs:
      check_id: ${{ steps.start.outputs.check_id }}
      external_id: ${{ steps.start.outputs.external_id }}
    steps:
      # Load and compile immutable policy before the App private key is exposed.
      - name: Load immutable check policy
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ needs.authorize.outputs.policy_sha }}
        run: |
          install -d "${RUNNER_TEMP}/protected-pr-ci"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/protected_pr_ci.py?ref=${POLICY_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/protected-pr-ci/controller.py"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/protected-pr-ci.json?ref=${POLICY_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          test -s "${RUNNER_TEMP}/protected-pr-ci/controller.py"
          test -s "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          python3 -m py_compile "${RUNNER_TEMP}/protected-pr-ci/controller.py"

      - name: Create checks-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YAML_SIGIL_RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.YAML_SIGIL_RELEASE_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Verify exact App token repository scope
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          python3 "${RUNNER_TEMP}/protected-pr-ci/controller.py" verify-app-token
          --config "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          --repository "${GITHUB_REPOSITORY}"

      # The token exists only in this checkout-free reporting job.
      - name: Create App-owned in-progress check
        id: start
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          python3 "${RUNNER_TEMP}/protected-pr-ci/controller.py" start-check
          --config "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          --github-output "${GITHUB_OUTPUT}"
          --repository "${GITHUB_REPOSITORY}"
          --pull-number "${{ needs.authorize.outputs.pull_number }}"
          --head-sha "${{ needs.authorize.outputs.head_sha }}"
          --base-sha "${{ needs.authorize.outputs.base_sha }}"
          --policy-sha "${{ needs.authorize.outputs.policy_sha }}"
          --binding-digest "${{ needs.authorize.outputs.binding_digest }}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"

  protected_ci:
    name: Run authorized protected CI
    needs:
      - authorize
      - start_check
    if: ${{ needs.authorize.outputs.authorized == 'true' && needs.start_check.result == 'success' }}
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/pr-ci.yml
    with:
      pull_number: ${{ needs.authorize.outputs.pull_number }}
      head_sha: ${{ needs.authorize.outputs.head_sha }}
      base_sha: ${{ needs.authorize.outputs.base_sha }}
      policy_sha: ${{ needs.authorize.outputs.policy_sha }}
      comment_id: ${{ needs.authorize.outputs.comment_id }}
      binding_digest: ${{ needs.authorize.outputs.binding_digest }}

  finish_check:
    name: Finalize protected Required CI check
    if: ${{ always() && needs.start_check.result == 'success' }}
    needs:
      - authorize
      - start_check
      - protected_ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: protected-automation
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      # Finalization compiles protected policy before the App key is exposed.
      - name: Load immutable check policy
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ needs.authorize.outputs.policy_sha }}
        run: |
          install -d "${RUNNER_TEMP}/protected-pr-ci"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/protected_pr_ci.py?ref=${POLICY_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/protected-pr-ci/controller.py"
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/protected-pr-ci.json?ref=${POLICY_SHA}" \
            --jq .content | base64 --decode > "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          test -s "${RUNNER_TEMP}/protected-pr-ci/controller.py"
          test -s "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          python3 -m py_compile "${RUNNER_TEMP}/protected-pr-ci/controller.py"

      - name: Create checks-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.YAML_SIGIL_RELEASE_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.YAML_SIGIL_RELEASE_PR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: write

      - name: Verify exact App token repository scope
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          python3 "${RUNNER_TEMP}/protected-pr-ci/controller.py" verify-app-token
          --config "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          --repository "${GITHUB_REPOSITORY}"

      # Results are fixed reusable-workflow output, not candidate-controlled input.
      - name: Revalidate state and finalize App check
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ needs.authorize.outputs.policy_sha }}
          RESULTS_JSON: ${{ needs.protected_ci.outputs.results_json }}
        run: >-
          python3 "${RUNNER_TEMP}/protected-pr-ci/controller.py" finish-check
          --event "${GITHUB_EVENT_PATH}"
          --config "${RUNNER_TEMP}/protected-pr-ci/policy.json"
          --check-id "${{ needs.start_check.outputs.check_id }}"
          --repository "${GITHUB_REPOSITORY}"
          --pull-number "${{ needs.authorize.outputs.pull_number }}"
          --head-sha "${{ needs.authorize.outputs.head_sha }}"
          --base-sha "${{ needs.authorize.outputs.base_sha }}"
          --policy-sha "${{ needs.authorize.outputs.policy_sha }}"
          --binding-digest "${{ needs.authorize.outputs.binding_digest }}"
          --comment-id "${{ needs.authorize.outputs.comment_id }}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"
          --results-json "${RESULTS_JSON}"
