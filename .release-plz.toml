[workspace]
release = false
release_always = false
changelog_update = true
# Tags and GitHub Releases carry version metadata and changelog text only.
# release-plz does not build or attach binary assets.
git_tag_enable = true
git_release_enable = true
git_release_type = "auto"
publish_allow_dirty = false
publish_no_verify = false
publish_timeout = "5m"
# The workflow runs the exact analyzer directly and fails on every error.
semver_check = false

[[package]]
name = "yaml-sigil-traits"
release = true
publish = true
# Preserve changelog, tag, and source-only GitHub Release behavior if workspace
# defaults later change.
changelog_update = true
changelog_path = "CHANGELOG.md"
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_name = "v{{ version }}"
git_release_body = "{{ changelog }}"
git_release_type = "auto"
