[workspace]

[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
# Keep the developer tool's target inventory explicit; only the declared
# library and binary below participate in validation.
autobenches = false
autobins = false
autoexamples = false
autotests = false
# This developer tool has no build script.
build = false
license = "Apache-2.0"
description = "Developer-only tasks for yaml-sigil-traits."

[lib]
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
cargo_metadata = { version = "=0.23.1", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = "0.4"
tempfile = "3.27"
toml_edit = { version = "0.25.15", default-features = false, features = ["display", "parse"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
