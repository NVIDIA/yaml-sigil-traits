[workspace]

[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Developer-only tasks for yaml-sigil-traits."

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
semver = "1.0"
serde_json = "1.0"
toml_edit = { version = "0.25.13", default-features = false, features = ["parse"] }
