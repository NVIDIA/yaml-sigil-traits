[workspace]
release = false
release_always = true
changelog_update = false
git_tag_enable = false
git_release_enable = false
publish_allow_dirty = true
# PR snapshots are fully packaged and verified in the preceding no-OIDC job.
# Skip the duplicate build while the short-lived publishing identity is live.
publish_no_verify = true
publish_timeout = "5m"

[[package]]
name = "yaml-sigil-traits"
release = true
publish = true
changelog_update = false
git_tag_enable = false
git_release_enable = false
publish_allow_dirty = true
publish_no_verify = true
