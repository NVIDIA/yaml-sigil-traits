# rumdl configuration for YamlSigil Markdown.
#
# This file is the repository's source of Markdown lint configuration. Use
# it with `rumdl check` when editing in-scope Markdown as described in
# AGENTS.md. The rumdl-vscode editor extension
# (https://github.com/rvben/rumdl-vscode) can also read it.
#
# Only rules whose configuration differs from rumdl's built-in defaults
# are listed below. Anything not mentioned uses the rumdl default.
#
# Reference: https://github.com/rvben/rumdl and https://rumdl.dev/

[global]
# These externally provided community documents are excluded from
# repository-specific Markdown linting.
exclude = [
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "source-spec/**",
]

# MD059 flags non-descriptive link text like `[here]` or `[this]`.
# Descriptive link text is an accessibility best practice, but MD059's
# findings in this repo are judgment calls on prose style rather than
# mechanical formatting (unlike MD013 line length or MD047 EOF newline).
# Disable globally so the lint pass stays noise-free; tighten link-text
# wording in editorial review passes instead.
disable = ["MD059"]

[per-file-ignores]
# The sole relative link in this notice targets the pinned source-spec
# submodule, which is deliberately excluded from rumdl's workspace index.
"THIRD_PARTY_NOTICES.md" = ["MD057"]

# --------------------------------------------------------------------
# Rule overrides
# --------------------------------------------------------------------

[MD010]
# markdownlint's default for `spaces_per_tab` is 1; rumdl's default is
# 4. Align with the 2-space list-indent convention (MD007) so that
# `rumdl check --fix` produces consistent output if a stray tab lands
# in a Markdown source.
spaces-per-tab = 2

[MD013]
# Reference: https://rumdl.dev/md013/
code-blocks = false

[MD033]
# The HTML tags the editorial conventions actually use in prose.
# Anything else fires MD033. Reference: https://rumdl.dev/md033/
allowed-elements = ["br", "img", "li", "p", "ul"]
